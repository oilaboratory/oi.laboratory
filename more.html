<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>More projects — Oi.Lab</title>
<meta property="og:site_name" content="Oi.Lab">
<meta property="og:type" content="website">
<meta property="og:title" content="More projects">
<meta property="og:description" content="Brands, visual systems and design for businesses, cultural projects and people with ideas.">
<meta property="og:image" content="https://oilaboratory.com/img/og2.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" type="image/png" href="img/favicon3.png">
<link rel="apple-touch-icon" href="img/apple-touch-icon2.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tinos&display=swap">
<link rel="stylesheet" href="site.css?v=1793859909">
<style>
/* «Ещё проекты»: проекты, кейсы которых ещё готовятся. Сетка как на главной, по клику — большая обложка; при входе — дисклеймер по центру */
main{padding-top:clamp(40px,6vw,80px)}
.top{display:flex;align-items:baseline;gap:8px;padding-bottom:24px}
.top h1{margin:0}
.top .n{color:var(--faint)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:40px 8px}
.card{cursor:pointer;outline:none}
.card .media{display:block;border-radius:4px;overflow:hidden}
.card .media img{display:block;width:100%;aspect-ratio:339/386;object-fit:cover;transition:transform .6s cubic-bezier(.23,1,.32,1)}
@media (hover:hover){.card:hover .media img{transform:scale(1.03)}.card:hover h3{color:var(--ink)}}
.card h3{margin:11px 0 0;color:var(--muted);transition:color .25s}
.card p{margin:2px 0 0;color:var(--faint)}
.card:focus-visible .media{outline:2px solid var(--ink);outline-offset:2px}
.back{display:flex;justify-content:center;margin:72px 0 0}
body .back .pill{height:34px;padding:0 18px;border-radius:17px}
/* дисклеймер — небольшое окно по центру поверх размытой страницы, как у gaadesign.studio */
.note{position:fixed;inset:0;z-index:95;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(255,255,255,.3);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);animation:pk .4s ease}
.note[hidden]{display:none}
.note-card{width:min(400px,100%);box-sizing:border-box;background:#f7f8f9;border:1px solid var(--chip);border-radius:20px;padding:12px;box-shadow:0 30px 80px rgba(35,55,70,.14);animation:pk-up .55s cubic-bezier(.22,1.12,.36,1)}
.note-card h2{display:flex;align-items:center;gap:8px;margin:0;background:var(--bg);border-radius:10px;padding:10px 12px;color:var(--ink)}
.note-card h2 i{width:7px;height:7px;border-radius:50%;background:var(--dot);flex:none}
.note-card p{margin:12px 4px 14px;color:var(--muted)}
.note-card .row{display:flex;justify-content:center}
/* большая обложка поверх слоя */
.peek{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:24px;background:rgba(255,255,255,.3);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);animation:pk .35s ease}
.peek[hidden]{display:none}
@keyframes pk{from{opacity:0}}
@keyframes pk-up{from{opacity:0;transform:translateY(16px) scale(.98)}}
.peek-card{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;width:min(820px,100%);background:#f7f8f9;border:1px solid var(--chip);border-radius:24px;padding:16px;box-shadow:0 30px 80px rgba(35,55,70,.12);animation:pk-up .5s cubic-bezier(.22,1.12,.36,1)}
.peek-card img{width:100%;aspect-ratio:339/386;object-fit:cover;border-radius:12px;display:block}
.peek-b{display:flex;flex-direction:column;gap:6px;padding:8px 8px 4px}
.peek-b h3{margin:0;font-size:var(--fs-h);line-height:1.1;color:var(--ink)}
.peek-f{margin:0;font-size:13px;line-height:1.3;color:var(--muted)}
.peek-b p:not(.peek-f){margin:auto 0 0;font-size:15px;line-height:1.4;color:var(--ink)}
.peek-act{display:flex;gap:6px;margin-top:10px}
body .peek-act .nav-contact,body .note-box .ok{background:var(--ink);color:#fff}
body .peek-act .nav-contact:hover,body .note-box .ok:hover{background:var(--ink);opacity:.85;color:#fff}
@media (max-width:1000px){.grid{grid-template-columns:repeat(3,1fr)}}
@media (max-width:767px){.grid{grid-template-columns:1fr 1fr;gap:28px 8px}.peek{align-items:end;padding:12px}.peek-card{grid-template-columns:1fr;border-radius:20px}.peek-card img{aspect-ratio:4/3}}
</style>
</head>
<body class="project">
<header id="hdr">
  <a class="logo" href="./" aria-label="Oi.Lab"><span class="mark"></span></a>
  <nav id="nav"></nav>
  <span class="right"><span class="langs"></span></span>
  <div class="fade" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
</header>

<main>
  <div class="top"><h1 class="cap-h" data-i="more.title">More projects</h1><span class="n" id="n"></span></div>
  <div class="grid" id="mini"></div>
  <div class="back"><a class="pill" href="./#projects" data-i="more.back">Back to home</a></div>
</main>

<div class="note" id="note" role="dialog" aria-modal="true" aria-labelledby="note-t">
  <div class="note-card"><h2 id="note-t"><i aria-hidden="true"></i><span data-i="more.noteT"></span></h2><p data-i="more.note"></p><div class="row"><button class="pill ok" type="button" data-i="more.ok"></button></div></div>
</div>
<div class="peek" id="peek" role="dialog" aria-modal="true" aria-labelledby="peek-t" hidden>
  <div class="peek-card"><img id="peek-img" alt=""><div class="peek-b"><h3 id="peek-t"></h3><p class="peek-f" id="peek-f"></p><p data-i="peek.text"></p>
    <div class="peek-act"><a class="pill nav-contact" href="#"><span data-i="peek.cta"></span></a><button class="pill peek-x" type="button" data-i="close"></button></div></div></div>
</div>

<footer id="contact"></footer>
<div class="big" id="big" role="img" aria-label="Oilab"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie_light.min.js"></script>
<script src="i18n.js?v=1793859909" charset="utf-8"></script>
<script src="projects.js?v=1793859909" charset="utf-8"></script>
<script>
const MORE = PROJECTS.filter(p => !p.case);
const mini = document.getElementById('mini'), note = document.getElementById('note'), peek = document.getElementById('peek');
mini.innerHTML = MORE.map((p, i) => `<div class="card" data-k="${i}" tabindex="0" role="button"><span class="media"><img src="img/${p.img}.jpg" alt="${p.name}" loading="lazy"></span><h3>${p.name}</h3>${p.field ? `<p data-field="${p.field}"></p>` : ''}</div>`).join('');
document.getElementById('n').textContent = MORE.length;
const lock = () => document.documentElement.classList.toggle('bd-lock', !note.hidden || !peek.hidden);
const noteShow = on => { note.hidden = !on; lock(); };
const peekShow = on => { peek.hidden = !on; lock(); };
note.addEventListener('click', e => { if (e.target === note || e.target.closest('.ok')) noteShow(false); });
const openPeek = c => { const p = MORE[c.dataset.k];
  document.getElementById('peek-img').src = `img/${p.img}.jpg`; document.getElementById('peek-t').textContent = p.name;
  document.getElementById('peek-f').textContent = p.field ? tr(p.field) : ''; peekShow(true); };
mini.addEventListener('click', e => { const c = e.target.closest('.card'); if (c) openPeek(c); });
mini.addEventListener('keydown', e => { const c = e.target.closest('.card'); if (c && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); openPeek(c); } });
peek.addEventListener('click', e => { if (e.target === peek || e.target.closest('.peek-x, .nav-contact')) peekShow(false); });
addEventListener('keydown', e => { if (e.key !== 'Escape') return; if (!peek.hidden) peekShow(false); else if (!note.hidden) noteShow(false); });
window.pageRender = () => document.querySelectorAll('#mini p[data-field]').forEach(s => s.textContent = tr(s.dataset.field));
pageRender(); lock();
siteChrome();
playLottie('big', 'img/footer-logo.json', 'img/footer-logo.png');
</script>
</body>
</html>
