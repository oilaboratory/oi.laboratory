<style>
/* Главная: манифест и сетка проектов. Общие токены, шапка и футер — в site.css */

/* манифест */
.hero{padding-block:clamp(80px,18vw,240px);text-align:center;font-family:var(--serif);
  font-size:clamp(20px,2.17vw,32.5px);line-height:1.23;color:var(--hero);max-width:1350px;margin:0 auto}
.hero img,.hero video{display:inline-block;vertical-align:-0.15em}
.hero .wm{height:1.25em;margin-right:.15em}
.hero .nw{white-space:nowrap}
.hero .ppl{display:inline-block;position:relative;width:7.3em;height:1em;vertical-align:baseline;margin:0 -.2em}   /* иллюстрация в строке манифеста: крупная, выступает вверх, межстрочный интервал не меняется */
.hero br{display:none}
.hero br.hb{display:inline}   /* переносы строк как в макете (только компьютер) */
.hero .ppl > *{position:absolute;left:0;bottom:-.15em;display:block;width:100%;height:auto;aspect-ratio:1901/1049;mix-blend-mode:multiply}

/* проекты */
/* шапка сетки: «Проекты» в 1-й колонке, подпись «Сферы» в 3-й, сферы стопкой в 4-й (серым, выбранная — тёмным с ×, повторное нажатие сбрасывает) */
.head{display:grid;grid-template-columns:repeat(4,1fr);column-gap:8px;align-items:start;padding-bottom:40px}
html body div.head h2{color:var(--ink)}
html body div.head h2.sph{grid-column:3}
.cats{grid-column:4;display:flex;flex-direction:column;align-items:flex-start}
.cat{appearance:none;border:0;background:none;padding:0;margin:0;font:inherit;color:var(--muted);text-align:left;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:color .25s}
.cat:hover,.cat.is-on{color:var(--ink)}
.cat:disabled{color:var(--faint);cursor:default}
.cat svg{width:7px;height:7px}
.cat:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
/* поведение как у mouthwash.studio/work: тайминги .25s (цвет) и .33s (фильтр), нажатие scale(.985) */
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:40px 8px;transition:opacity .33s}
.grid.is-fading{opacity:0}
.card[hidden]{display:none}
.card .media{position:relative;display:block;border-radius:4px;overflow:hidden}
.card .media img,.card .media video{display:block;width:100%;aspect-ratio:339/386;object-fit:cover;max-width:100%}
.card .media .hover{position:absolute;inset:0;height:100%;opacity:0;transition:opacity .5s ease;pointer-events:none}
.card .media .cover{transition:opacity .5s ease}
.card h3{margin:11px 0 0;font-size:12px;line-height:1.2;font-weight:500;letter-spacing:-.03em;color:var(--muted);transition:color .25s}
.tags{display:flex;flex-wrap:wrap;gap:2px;margin-top:5px}
.tag{appearance:none;border:0;border-radius:4px;font:inherit;font-size:9px;line-height:11px;letter-spacing:-.03em;padding:4px 5.4px;
  background:var(--chip);color:var(--muted);cursor:pointer;transition:color .25s,background-color .25s}
.tag:active,.filter:active{transform:scale(.985)}
.tag.is-on{color:var(--ink)}
.filter{appearance:none;border:0;border-radius:8px;font:inherit;font-size:13px;letter-spacing:-.03em;padding:5px 8px;
  background:var(--chip);color:var(--muted);cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:color .25s,background-color .25s}
.filter svg{width:7px;height:7px}
@media (hover:hover){
  .card:hover h3{color:var(--ink)}
  .card .media:hover .hover{opacity:1}
  .card .media:hover:has(.hover) .cover{opacity:0}
  .tag:hover{color:var(--ink)}
  .filter:hover{color:var(--ink)}
}
.tag:focus-visible,.filter:focus-visible{outline:2px solid var(--ink);outline-offset:2px}


@media (max-width:1000px){.grid{grid-template-columns:repeat(2,1fr)}.head{grid-template-columns:repeat(2,1fr);row-gap:24px}.head h2:first-child{grid-column:1/-1}html body div.head h2.sph{grid-column:1}.cats{grid-column:2}}
.hero-art{display:none}
@media (max-width:767px){
  .hero{padding-block:48px 72px;text-align:left;font-size:24px;line-height:1.18}
  .hero-art{display:block;margin:0 -8px 28px}
  .hero-art video{display:block;width:100%;aspect-ratio:900/484;mix-blend-mode:multiply}
  .hero .ppl,.hero br,.hero br.hb{display:none}
  .hero .nw{white-space:normal}
  .grid{grid-template-columns:1fr;gap:44px}
}
 /* кнопка «Ещё проекты» под кейсами и слой со всеми остальными проектами */
.more-wrap{display:flex;justify-content:center;margin-top:56px}
body .more-btn{height:34px;padding:0 18px;border-radius:17px}
.more-btn .n{color:var(--muted)}
@media (max-width:767px){
}
/* первый экран (черновик 3), как вступление gionatannese.com: знак Oilab, подписи по бокам, счётчик 000→100; обложки слетаются в центр
   и раскрываются в кольцо, которое дальше бесконечно вращается вокруг знака; подписи и «100» остаются; ниже — сайт как обычно */
.orbx{position:relative;width:100vw;margin-left:calc(50% - 50vw);margin-top:-62px;height:100svh;min-height:520px;overflow:hidden}
.sph-st{position:absolute;inset:0}
.sph-st i{position:absolute;left:0;top:0;display:block;background:var(--chip) center/cover no-repeat;will-change:transform;opacity:0}
.sph-in{position:absolute;inset:0;pointer-events:none;z-index:5000}
.sph-st{z-index:0}
html body .orbx .sl{position:absolute;top:50%;translate:0 -50%;font-size:14px;line-height:1.2;color:var(--ink);white-space:nowrap;opacity:0}
.orbx .sl.l{left:var(--pad)}
.orbx .sl.c{left:50%;translate:-50% -50%;transition:opacity .5s}
.orbx .sl.c .mk{display:block;height:26px;aspect-ratio:110/64;background:var(--ink);-webkit-mask:url(img/logo-mask.png) center/contain no-repeat;mask:url(img/logo-mask.png) center/contain no-repeat}   /* знак, как в шапке */   /* как в референсе: подпись поверх стопки, на белой плашке */
.orbx .sl.r{right:var(--pad);font:400 15px/1.1 var(--serif);letter-spacing:0!important}
.orbx .sl.n{top:auto;bottom:20px;left:50%;translate:-50% 0;font:400 15px/1.1 var(--serif);letter-spacing:0!important;font-variant-numeric:tabular-nums}
.orbx .sl b{display:inline-block;font-weight:inherit;overflow:hidden;vertical-align:top}
.orbx .sl b > em{display:inline-block;font-style:normal;transform:translateY(105%);transition:transform .7s cubic-bezier(.23,1,.32,1)}
.orbx .sl.on b > em{transform:none}
html.boot header,html.boot .buddy{animation:tagIn .9s ease 3.7s both}
@keyframes tagIn{from{opacity:0}to{opacity:1}}
html.lock,html.lock body{overflow:hidden;overscroll-behavior:none;touch-action:none}
@media (max-width:767px){
  .orbx{height:100svh;margin-top:-72px}
  .orbx .sl.l{top:calc(50% - 40px);left:50%;translate:-50% -50%}
  .orbx .sl.r{top:calc(50% + 40px);right:auto;left:50%;translate:-50% -50%}
  .orbx .sl.c .mk{height:22px}
}
/* сферы и теги в стиле навигации gionatannese.com: антиква, номер сферы индексом, теги — светлые плашки с радиусом 4px */
html body .cats button.cat{font:400 15px/1.35 var(--serif)!important;letter-spacing:0!important;align-items:flex-start;gap:2px}
.cat sup,.tag sup{font:400 9px/1 var(--sans);letter-spacing:0;position:relative;top:-1px;margin-left:1px}
html body .tags{gap:4px;margin-top:8px}
html body .tag{display:inline-flex;align-items:flex-start;font:400 13px/1 var(--serif);letter-spacing:0!important;padding:5px 7px;border-radius:4px;background:rgba(237,237,237,.5);color:var(--muted)}
html body .tag:hover,html body .tag.is-on{color:var(--ink);background:rgba(225,225,225,.75)}
html body .tag.field{color:var(--ink)}
</style>

</head>
<body>
<script>(function(){
  // вступление (как на gionatannese.com) — при входе и обновлении; при переходе с других страниц сайта сфера сразу на месте
  var nav = (performance.getEntriesByType && performance.getEntriesByType('navigation')[0] || {}).type;
  var internal = nav !== 'reload' && (nav === 'back_forward' || (document.referrer && new URL(document.referrer).origin === location.origin));
  if (!internal && !matchMedia('(prefers-reduced-motion: reduce)').matches) {
    var h = document.documentElement; h.classList.add('boot', 'lock');
    if ('scrollRestoration' in history) history.scrollRestoration = 'manual'; scrollTo(0, 0);
    setTimeout(function(){ h.classList.remove('lock'); }, 4300);
  }
})();</script>
<header>
  <a class="logo" href="./" aria-label="Oi.Lab"><span class="mark"></span></a>
  <nav id="nav"></nav>
  <span class="right"><span class="langs"></span></span>
  <div class="fade" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
</header>

<div class="wrap">

  <section class="orbx" id="top" aria-label="Oi.Lab">
    <div class="sph-st" id="sphSt" aria-hidden="true"></div>
    <div class="sph-in" aria-hidden="true">
      <span class="sl l" id="sphL">Oi.Laboratory</span>
      <span class="sl c" id="sphC"><i class="mk"></i></span>
      <span class="sl r" id="sphR"></span>
      <span class="sl n" id="sphN">000</span>
    </div>
  </section>

  <section class="hero">
    <div class="hero-art" aria-hidden="true"><video src="img/hero-people.mp4" poster="img/hero-people-poster.jpg" autoplay muted loop playsinline></video></div>
    <div id="heroText"></div>
  </section>

  <section id="projects">
    <div class="head"><h2 data-i="projects">Projects</h2><h2 class="sph" data-i="spheres">Spheres</h2><div class="cats" id="cats"></div></div>
    <div class="grid" id="grid"></div>
    <div class="more-wrap"><a class="pill more-btn" href="more.html" id="moreBtn"><span data-i="more.title">More projects</span> <span class="n" id="moreN"></span></a></div>
  </section>


  <footer id="contact"></footer>
</div>
<div class="big" id="big" role="img" aria-label="Oilab"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie_light.min.js"></script>
<script src="i18n.js?v=1794656211" charset="utf-8"></script>
<script src="projects.js?v=1794656211" charset="utf-8"></script>
<script>
// hover: вторая фотография проекта (или .mp4) — плавно сменяет обложку при наведении. Пример: {name:"Кайрат", img:"p01", hover:"img/p01-2.jpg", tags:[...]}
const grid = document.getElementById('grid');
const tagsOf = p => [...fieldsOf(p), ...(p.tags||[])].filter(Boolean).join('|');
grid.innerHTML = PROJECTS.filter(p => p.case).map(p => `
  <div class="card" data-tags="${tagsOf(p)}">
    <a href="case.html#${slug(p)}">
      <span class="media">
        <img class="cover" src="img/${p.img}.jpg" alt="${p.name}" loading="lazy">
        ${p.hover ? (/\.(mp4|webm)$/.test(p.hover)
          ? `<video class="hover" src="${p.hover}" muted loop playsinline autoplay></video>`
          : `<img class="hover" src="${p.hover.replace(/(\/[^/]+\/[^/]+)\.jpg$/, '$1-m.jpg')}" alt="" loading="lazy" decoding="async">`) : ''}
      </span>
      <h3>${p.name}</h3>
    </a>
    <div class="tags">${fieldsOf(p).map(f => `<button class="tag field" type="button" data-tag="${f}">${tr(f)}<sup>${FIELDS.indexOf(f) + 1}</sup></button>`).join('')}${(p.tags||[]).map(g=>`<button class="tag" type="button" data-tag="${g}">${tr(g)}</button>`).join('')}</div>
  </div>`).join('');
// проекты без открытого кейса: в сетке появляются только при выборе сферы/тега, клик ведёт на «Ещё проекты» и открывает карточку
const MORE = PROJECTS.filter(p => !p.case);
grid.insertAdjacentHTML('beforeend', MORE.map((p, i) => `
  <div class="card extra soon" data-tags="${tagsOf(p)}" hidden>
    <a href="more.html#k-${i}">
      <span class="media"><img class="cover" src="img/${p.img}.jpg" alt="${p.name}" loading="lazy"><span class="soon-pill">${t('soon')}</span></span>
      <h3>${p.name}</h3>
    </a>
    <div class="tags">${fieldsOf(p).map(f => `<button class="tag field" type="button" data-tag="${f}">${tr(f)}<sup>${FIELDS.indexOf(f) + 1}</sup></button>`).join('')}${(p.tags||[]).map(g=>`<button class="tag" type="button" data-tag="${g}">${tr(g)}</button>`).join('')}</div>
  </div>`).join(''));
document.getElementById('moreN').textContent = MORE.length;

// клик по тегу фильтрует сетку: исчезает за .33s, перестраивается, проявляется; сверху плашка «тег ×»
const X = '<svg viewBox="0 0 8 9" fill="none"><path d="M1 1.25L7.5 7.75M7.5 1.25L1 7.75" stroke="currentColor"/></svg>';
let current = null;
function filter(tag){
  if (tag === current) return;
  current = tag;
  grid.classList.add('is-fading');
  setTimeout(() => {
    grid.querySelectorAll('.card').forEach(c => c.hidden = tag ? !c.dataset.tags.split('|').includes(tag) : c.classList.contains('extra'));
    renderCats();
    grid.querySelectorAll('.tag').forEach(b => b.classList.toggle('is-on', b.dataset.tag === tag));
    grid.classList.remove('is-fading');
  }, matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : 330);
}
grid.addEventListener('click', e => { const b = e.target.closest('.tag'); if (b) filter(b.dataset.tag); });
// список: сферы деятельности (FIELDS в i18n.js); если выбран тег услуги с карточки — он добавляется плашкой с ×
function renderCats(){
  // как вкладки у gionatannese.com: название антиквой + номер сферы индексом (тот же номер стоит у сферы на карточке)
  const pill = (tag, label, on) => `<button class="cat${on ? ' is-on' : ''}" type="button" data-tag="${tag}">${label}${FIELDS.includes(tag) ? `<sup>${FIELDS.indexOf(tag) + 1}</sup>` : ''}${on ? X : ''}</button>`;
  document.getElementById('cats').innerHTML = FIELDS.map(f => pill(f, tr(f), current === f)).join('')
    + (current && !FIELDS.includes(current) ? pill(current, tr(current), true) : '');
}
renderCats();
document.getElementById('cats').addEventListener('click', e => { const b = e.target.closest('.cat'); if (b) filter(!b.dataset.tag || b.dataset.tag === current ? null : b.dataset.tag); });
// ссылка вида index.html#t-visual-identity (из паспорта кейса) сразу включает фильтр по тегу
const fromHash = PROJECTS.flatMap(p => [...fieldsOf(p), ...(p.tags||[])]).filter(Boolean).find(t => '#t-' + t.toLowerCase().replace(/[^a-z0-9]+/g,'-') === location.hash);
if (fromHash) { filter(fromHash); document.getElementById('projects').scrollIntoView(); }

// манифест: текст на выбранном языке, знак Oilab и анимация встраиваются в строку
const WM = '<img class="wm" src="img/wordmark.png" alt="Oilab">';
const ART = '<span class="ppl" id="ppl" aria-hidden="true"><video src="img/hero-people.mp4" poster="img/hero-people-poster.jpg" autoplay muted loop playsinline></video></span>';

// ——— кольцо из обложек проектов вокруг знака (как во вступлении gionatannese.com): наклонённая окружность в 3D,
// обложки всегда смотрят на зрителя, кольцо вращается бесконечно; вступление — точки по экрану → стопка в центре → кольцо ———
(() => {
  const st = document.getElementById('sphSt'), sec = st.parentElement, BOOT = document.documentElement.classList.contains('boot');
  const STILL = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const L = [...PROJECTS.filter(p => p.case), ...PROJECTS.filter(p => !p.case)].filter(p => p.img).slice(0, 14), N = L.length;
  const rnd = (i, k) => { const x = Math.sin(i * 12.9898 + k * 78.233) * 43758.5453; return x - Math.floor(x); };
  const It = L.map((p, i) => {
    const el = document.createElement('i'); el.style.backgroundImage = `url(img/${p.img}.jpg)`; st.appendChild(el);
    return { el, ph: i / N * Math.PI * 2, k: .85 + rnd(i, 1) * .3, sx: rnd(i, 2), sy: rnd(i, 3) };
  });
  let W, H, R, B;
  const size = () => { W = sec.clientWidth; H = sec.clientHeight; const m = Math.min(W, H), ph = W < 768;
    R = ph ? W * .43 : m * .36; B = ph ? W * .17 : Math.max(48, m * .085);
    It.forEach(c => { c.el.style.width = B * c.k + 'px'; c.el.style.height = B * c.k * 772 / 678 + 'px'; }); };
  size(); addEventListener('resize', size);
  const T0 = performance.now(), ease = t => t <= 0 ? 0 : t >= 1 ? 1 : 1 - Math.pow(1 - t, 3), eio = t => t <= 0 ? 0 : t >= 1 ? 1 : t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  const SH = BOOT ? 0 : 4;   // без вступления — сразу в конец сценария
  const lab = (el, txt) => { el.innerHTML = txt.split(' ').map(w => `<b><em>${w}</em></b>`).join(' '); };
  const sL = document.getElementById('sphL'), sC = document.getElementById('sphC'), sR = document.getElementById('sphR'), sN = document.getElementById('sphN');
  lab(sL, sL.textContent); lab(sR, t('tagline'));
  const show = (el, on) => { el.style.opacity = on ? 1 : 0; requestAnimationFrame(() => requestAnimationFrame(() => el.classList.toggle('on', on))); };
  if (BOOT) { setTimeout(() => show(sC, true), 200); setTimeout(() => { show(sL, true); show(sR, true); sN.style.opacity = 1; }, 900); }
  else { [sC, sL, sR].forEach(el => show(el, true)); sN.style.opacity = 1; sN.textContent = '100'; }
  // наклон плоскости кольца: вокруг X на 62° (смотрим чуть сверху) и вокруг Z на −18° — как в референсе
  const TX = 62 * Math.PI / 180, TZ = -18 * Math.PI / 180, cX = Math.cos(TX), sX = Math.sin(TX), cZ = Math.cos(TZ), sZ = Math.sin(TZ);
  const tick = now => {
    const t = (now - T0) / 1000 + SH;
    if (BOOT && t < 3.5) sN.textContent = String(Math.round(ease((t - .9) / 2.5) * 100)).padStart(3, '0');
    const spin = STILL ? 0 : t * 2 * Math.PI / 45, cx = W / 2, cy = H / 2, D = R * 4;   // оборот за 45 с, без остановки
    It.forEach((c, i) => {
      const a = c.ph + spin, x0 = Math.cos(a), z0 = Math.sin(a);
      const y1 = -z0 * sX, z1 = z0 * cX;                    // наклон вокруг X
      const x2 = x0 * cZ - y1 * sZ, y2 = x0 * sZ + y1 * cZ;  // поворот вокруг Z
      const p = D / (D - z1 * R), Sx = cx + x2 * R * p, Sy = cy + y2 * R * p;
      // вступление как у референса: обложки сразу на своих местах кольца, проявляются по очереди (fade), кольцо уже вращается
      const w = B * c.k, h = w * 772 / 678, f = BOOT ? Math.min(1, Math.max(0, (t - 1.2 - i * .12) / .6)) : 1;
      c.el.style.transform = `translate3d(${(Sx - w / 2).toFixed(1)}px,${(Sy - h / 2).toFixed(1)}px,0) scale(${p.toFixed(3)})`;
      c.el.style.opacity = f.toFixed(2);
      c.el.style.zIndex = Math.round(1000 + z1 * 500);
    });
    requestAnimationFrame(tick);
  };  requestAnimationFrame(tick);
})();
window.pageRender = () => {
  // иллюстрация стоит в начале абзаца и плавает справа — текст обтекает её слева
  document.getElementById('heroText').innerHTML = t('hero').replace('{WM}', WM).replace('{ART}', ART);
  document.querySelectorAll('.tag').forEach(b => b.firstChild.textContent = tr(b.dataset.tag));
  renderCats();
};
pageRender();
siteChrome();

playLottie('big', 'img/footer-logo.json', 'img/footer-logo.png');   // подвал; без плеера — статичный логотип
</script>

</body>
</html>
