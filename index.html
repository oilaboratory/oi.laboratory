<style>
/* Главная: манифест и сетка проектов. Общие токены, шапка и футер — в site.css */

/* манифест */

/* проекты */
/* шапка сетки: «Проекты» в 1-й колонке, подпись «Сферы» в 3-й, сферы стопкой в 4-й (серым, выбранная — тёмным с ×, повторное нажатие сбрасывает) */
.head{display:grid;grid-template-columns:repeat(4,1fr);column-gap:8px;align-items:start;padding-bottom:40px}
html body div.head h2{color:var(--muted)}
html body div.head h2.sph{grid-column:3}
.cats{grid-column:4;display:flex;flex-direction:column;align-items:flex-start}
.cat{appearance:none;border:0;background:none;padding:0;margin:0;font:inherit;color:var(--muted);text-align:left;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:color .25s}
.cat:hover,.cat.is-on{color:var(--ink)}
.cat:disabled{color:var(--faint);cursor:default}
.cat svg{width:7px;height:7px}
.cat:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
/* поведение как у mouthwash.studio/work: тайминги .25s (цвет) и .33s (фильтр), нажатие scale(.985) */
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:40px 8px;transition:opacity .33s}
.grid.is-fading{opacity:0}
.card[hidden]{display:none}
.card .media{position:relative;display:block;border-radius:4px;overflow:hidden}
.card .media img,.card .media video{display:block;width:100%;aspect-ratio:339/386;object-fit:cover;max-width:100%}
.card .media .hover{position:absolute;inset:0;height:100%;opacity:0;transition:opacity .5s ease;pointer-events:none}
.card .media .cover{transition:opacity .5s ease}
.card h3{margin:11px 0 0;font-size:12px;line-height:1.2;font-weight:500;letter-spacing:-.03em;color:var(--muted);transition:color .25s}
.tags{display:flex;flex-wrap:wrap;gap:2px;margin-top:5px}
.tag{appearance:none;border:0;border-radius:4px;font:inherit;font-size:9px;line-height:11px;letter-spacing:-.03em;padding:4px 5.4px;
  background:var(--chip);color:var(--muted);cursor:pointer;transition:color .25s,background-color .25s}
.tag:active,.filter:active{transform:scale(.985)}
.tag.is-on{color:var(--ink)}
.filter{appearance:none;border:0;border-radius:8px;font:inherit;font-size:13px;letter-spacing:-.03em;padding:5px 8px;
  background:var(--chip);color:var(--muted);cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:color .25s,background-color .25s}
.filter svg{width:7px;height:7px}
@media (hover:hover){
  .card:hover h3{color:var(--ink)}
  .card .media:hover .hover{opacity:1}
  .card .media:hover:has(.hover) .cover{opacity:0}
  .tag:hover{color:var(--ink)}
  .filter:hover{color:var(--ink)}
}
.tag:focus-visible,.filter:focus-visible{outline:2px solid var(--ink);outline-offset:2px}


@media (max-width:1000px){.grid{grid-template-columns:repeat(2,1fr)}.head{grid-template-columns:repeat(2,1fr);row-gap:24px}.head h2:first-child{grid-column:1/-1}html body div.head h2.sph{grid-column:1}.cats{grid-column:2}}
@media (max-width:767px){
  .grid{grid-template-columns:1fr;gap:44px}
}
 /* кнопка «Ещё проекты» под кейсами и слой со всеми остальными проектами */
.more-wrap{display:flex;justify-content:center;margin-top:56px}
body .more-btn{height:34px;padding:0 18px;border-radius:17px}
.more-btn .n{color:var(--muted)}
@media (max-width:767px){
}
/* первый экран на всю высоту окна: проекты в кругах вокруг названия. При входе круги «подлетают» из глубины (масштаб),
   при наведении мягко тянутся за курсором, как на telescope.fyi. Круги не ссылки */
.orb{position:relative;width:100vw;margin-left:calc(50% - 50vw);height:calc(100svh - 62px);min-height:560px;overflow:hidden}
.orb-c{position:absolute;left:50%;top:44%;translate:-50% -50%;text-align:center;pointer-events:none;z-index:2;white-space:nowrap}
html body .orb-c :is(h1,p){margin:0;font-size:40px;line-height:1.12;letter-spacing:-.02em!important;color:var(--muted)}
/* при входе надпись проявляется бледной, а вместе с появлением кругов плавно становится серым цветом текстов сайта (--muted) */
html.boot body .orb-c :is(h1,p){animation:toInk 1.6s ease 2.3s both}
@keyframes toInk{from{color:var(--faint)}to{color:var(--muted)}}
.orb-c i{display:inline-block;font-style:normal;white-space:pre}
html.boot .orb-c i{opacity:0;filter:blur(10px);animation:introL .6s ease-out forwards}
html.lock,html.lock body{overflow:hidden;overscroll-behavior:none;touch-action:none}
html.boot header,html.boot .buddy{animation:tagIn .9s ease 2.3s both}
@keyframes tagIn{from{opacity:0;filter:blur(8px);transform:translateY(8px)}to{opacity:1;filter:none;transform:none}}
/* круги: положение/вход/перетаскивание/инерция считает скрипт (transform), здесь — только место по макету */
.o{position:absolute;left:calc(var(--x) * 1%);top:calc(var(--y) * 1%);width:calc(var(--r) * 2 / 15.12 * 1vw);aspect-ratio:1;translate:-50% -50%;
  opacity:0;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
.o.drag{cursor:grabbing}
.o > span{display:block;width:100%;height:100%;border-radius:50%;overflow:hidden;background:var(--chip);will-change:transform}
.o img{display:block;width:100%;height:100%;object-fit:cover;pointer-events:none;-webkit-user-drag:none}
@media (max-width:1599px){html body .orb-c :is(h1,p){font-size:36px}}
@media (max-width:1199px){html body .orb-c :is(h1,p){font-size:28px}}
.lead2{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));column-gap:8px;padding-block:24px clamp(80px,9vw,140px)}
html body .lead2 p{grid-column:1/4;margin:0;max-width:44em;font-size:var(--fs-lead);line-height:1.3;color:var(--muted)}
html body .lead2 ul{grid-column:4;list-style:none;margin:0;padding:0;font-size:var(--fs-cap);line-height:1.4;color:var(--muted)}
@media (max-width:767px){
  .orb{height:100svh;min-height:600px;margin-top:-72px}   /* шапка на телефоне поверх экрана */
  .o{left:calc(var(--mx) * 1%);top:calc(50% + var(--my) * 1vw);width:calc(var(--mr) * 2 / 7.36 * 1vw)}   /* всё от ширины экрана и от центра — раскладка точь-в-точь как в макете на любом телефоне */
  .orb-c{top:50%}
  html body .orb-c :is(h1,p){font-size:22px}
  .lead2{grid-template-columns:1fr;row-gap:24px;padding-top:8px}
  html body .lead2 p,html body .lead2 ul{grid-column:1;max-width:none}   /* текст на всю ширину, услуги под ним с того же края */
}
</style>

<!-- заставка при входе: название проявляется по буквам из размытия, потом страница; при входе и обновлении -->
<script>(function(){
  // при входе на сайт и при обновлении: «Oi.Laboratory» проявляется по буквам, ниже фраза, потом навигация и круги.
  // при переходе с других страниц сайта (Projects, логотип, «назад») всё уже на месте
  var nav = (performance.getEntriesByType && performance.getEntriesByType('navigation')[0] || {}).type;
  var internal = nav !== 'reload' && (nav === 'back_forward' || (document.referrer && new URL(document.referrer).origin === location.origin));
  if (!internal && !matchMedia('(prefers-reduced-motion: reduce)').matches) {
    // пока идёт появление (название → фраза → навигация и круги), страницу нельзя пролистать; начинаем всегда с самого верха
    var h = document.documentElement; h.classList.add('boot', 'lock');
    if ('scrollRestoration' in history) history.scrollRestoration = 'manual'; scrollTo(0, 0);
    setTimeout(function(){ h.classList.remove('lock'); }, 4000);
  }
})();</script>

<div class="wrap">

<script src="i18n.js?v=1794068014" charset="utf-8"></script>
<script src="projects.js?v=1794068014" charset="utf-8"></script>
<script>
// hover: вторая фотография проекта (или .mp4) — плавно сменяет обложку при наведении. Пример: {name:"Кайрат", img:"p01", hover:"img/p01-2.jpg", tags:[...]}
const grid = document.getElementById('grid');
const tagsOf = p => [...fieldsOf(p), ...(p.tags||[])].filter(Boolean).join('|');
grid.innerHTML = PROJECTS.filter(p => p.case).map(p => `
  <div class="card" data-tags="${tagsOf(p)}">
    <a href="case.html#${slug(p)}">
      <span class="media">
        <img class="cover" src="img/${p.img}.jpg" alt="${p.name}" loading="lazy">
        ${p.hover ? (/\.(mp4|webm)$/.test(p.hover)
          ? `<video class="hover" src="${p.hover}" muted loop playsinline autoplay></video>`
          : `<img class="hover" src="${p.hover.replace(/(\/[^/]+\/[^/]+)\.jpg$/, '$1-m.jpg')}" alt="" loading="lazy" decoding="async">`) : ''}
      </span>
      <h3>${p.name}</h3>
    </a>
    <div class="tags">${fieldsOf(p).map(f => `<button class="tag field" type="button" data-tag="${f}">${tr(f)}</button>`).join('')}${(p.tags||[]).map(g=>`<button class="tag" type="button" data-tag="${g}">${tr(g)}</button>`).join('')}</div>
  </div>`).join('');
// проекты без открытого кейса: в сетке появляются только при выборе сферы/тега, клик ведёт на «Ещё проекты» и открывает карточку
const MORE = PROJECTS.filter(p => !p.case);
grid.insertAdjacentHTML('beforeend', MORE.map((p, i) => `
  <div class="card extra soon" data-tags="${tagsOf(p)}" hidden>
    <a href="more.html#k-${i}">
      <span class="media"><img class="cover" src="img/${p.img}.jpg" alt="${p.name}" loading="lazy"><span class="soon-pill">${t('soon')}</span></span>
      <h3>${p.name}</h3>
    </a>
    <div class="tags">${fieldsOf(p).map(f => `<button class="tag field" type="button" data-tag="${f}">${tr(f)}</button>`).join('')}${(p.tags||[]).map(g=>`<button class="tag" type="button" data-tag="${g}">${tr(g)}</button>`).join('')}</div>
  </div>`).join(''));
document.getElementById('moreN').textContent = MORE.length;

// клик по тегу фильтрует сетку: исчезает за .33s, перестраивается, проявляется; сверху плашка «тег ×»
const X = '<svg viewBox="0 0 8 9" fill="none"><path d="M1 1.25L7.5 7.75M7.5 1.25L1 7.75" stroke="currentColor"/></svg>';
let current = null;
function filter(tag){
  if (tag === current) return;
  current = tag;
  grid.classList.add('is-fading');
  setTimeout(() => {
    grid.querySelectorAll('.card').forEach(c => c.hidden = tag ? !c.dataset.tags.split('|').includes(tag) : c.classList.contains('extra'));
    renderCats();
    grid.querySelectorAll('.tag').forEach(b => b.classList.toggle('is-on', b.dataset.tag === tag));
    grid.classList.remove('is-fading');
  }, matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : 330);
}
grid.addEventListener('click', e => { const b = e.target.closest('.tag'); if (b) filter(b.dataset.tag); });
// список: сферы деятельности (FIELDS в i18n.js); если выбран тег услуги с карточки — он добавляется плашкой с ×
function renderCats(){
  const pill = (tag, label, on) => `<button class="cat${on ? ' is-on' : ''}" type="button" data-tag="${tag}">${label}${on ? X : ''}</button>`;
  document.getElementById('cats').innerHTML = FIELDS.map(f => pill(f, tr(f), current === f)).join('')
    + (current && !FIELDS.includes(current) ? pill(current, tr(current), true) : '');
}
renderCats();
document.getElementById('cats').addEventListener('click', e => { const b = e.target.closest('.cat'); if (b) filter(!b.dataset.tag || b.dataset.tag === current ? null : b.dataset.tag); });
// ссылка вида index.html#t-visual-identity (из паспорта кейса) сразу включает фильтр по тегу
const fromHash = PROJECTS.flatMap(p => [...fieldsOf(p), ...(p.tags||[])]).filter(Boolean).find(t => '#t-' + t.toLowerCase().replace(/[^a-z0-9]+/g,'-') === location.hash);
if (fromHash) { filter(fromHash); document.getElementById('projects').scrollIntoView(); }


// круги первого экрана: [проект, x, y, радиус] — компьютер (макет 1500×630) и телефон (390×600); позже в списке — выше по слою
// последние три числа — телефон, по макету 736×1198 (центр надписи — y 599): x, y, радиус
const ORBS = [['KUN',176,252,124, 120,428,87],['Special Thanks',427,131,56, 233,286,57],['Fading Tales',563,161,38, 341,215,38],['1135',904,154,47, 495,316,57],
  ["Kira D'Archi",1063,97,54, 630,298,45],['ushiro',1292,168,123, 663,438,68],['allfolk',1384,369,78, 675,731,45],['Sezim',334,520,121, 580,885,117],['Straight Shift',546,518,62, 119,748,60],
  ['TAU',703,606,48, 251,800,34],['Dudeontheguitar',861,616,65, 88,885,62],['7:20',1110,520,68, 407,1033,76],['muni',1253,602,53, 227,987,53]];
const BOOT = document.documentElement.classList.contains('boot');   // при входе на сайт: название → фраза → навигация и круги
const STILL = matchMedia('(prefers-reduced-motion: reduce)').matches;
// буквы проявляются по очереди: сначала «Oi.Laboratory», за ним фраза — той же анимацией
const letters = (txt, from, step) => txt.split('').map((c, i) => `<i style="animation-delay:${(from + i * step).toFixed(2)}s">${c}</i>`).join('');
const orbT = document.getElementById('orbT'), orbP = document.getElementById('orbP');
if (BOOT) orbT.innerHTML = letters(orbT.textContent, .15, .06);
let firstTag = BOOT;
const renderTag = () => { orbP.innerHTML = firstTag ? letters(t('tagline'), 1.05, .035) : t('tagline'); firstTag = false; };

const orb = document.querySelector('.orb');
orb.querySelector('#orbs').innerHTML = ORBS.map(([n, x, y, r, mx, my, mr]) => {
  const p = PROJECTS.find(q => q.name === n); if (!p) return '';
  return `<div class="o" style="--x:${(x/15.12).toFixed(2)};--y:${(y/7.52).toFixed(2)};--r:${r};--mx:${(mx/7.36).toFixed(2)};--my:${((my - 599)/7.36).toFixed(2)};--mr:${mr}"><span><img src="img/${p.img}.jpg" alt="${p.name}" draggable="false"></span></div>`;
}).join('');

/* Круги — шарики в общем поле (один requestAnimationFrame):
   вход: из глубины (масштаб .55→1, расстояние до центра 84%→100%) с лёгким доворотом по часовой стрелке (−14° → 0);
   перетаскивание: шарик мягко догоняет палец/курсор (пружина), поэтому движение плавное, без рывков;
   столкновения: шарики расталкивают друг друга с учётом «массы» (площади); от краёв экрана мягко отскакивают;
   инерция: после отпускания шарик катится с той скоростью, что у него была, и тормозит трением —
   резкий бросок уходит далеко, медленный почти сразу встаёт. Пока никого не трогали, шарики стоят по макету (даже внахлёст) */
const fine = matchMedia('(hover:hover) and (pointer:fine)').matches;
let zTop = 10, W0 = orb.clientWidth, H0 = orb.clientHeight;
// очерёдность появления — по кругу по часовой стрелке, начиная сверху (за ~0,5 с), чтобы круги «разворачивались» веером
const O = [...orb.querySelectorAll('.o')].map(el => {
  const ang = Math.atan2(el.offsetTop - orb.clientHeight * .44, el.offsetLeft - orb.clientWidth / 2), turn = ((ang + Math.PI / 2) / (2 * Math.PI) + 1) % 1;
  return { el, x: el.offsetLeft, y: el.offsetTop, vx: 0, vy: 0, sc: 1, hs: 1, live: false, drag: null, t0: (BOOT ? 2300 : 100) + turn * 500 };
});
addEventListener('resize', () => {   // при смене размера окна шарики сохраняют относительное место
  const W = orb.clientWidth, H = orb.clientHeight; O.forEach(c => { c.x *= W / W0; c.y *= H / H0; }); W0 = W; H0 = H;
});
const T0 = performance.now(), DUR = 2400, ease = t => 1 - Math.pow(1 - t, 4), FR = .86, BOUNCE = .5;
const tick = now => {
  const W = orb.clientWidth, H = orb.clientHeight, cx = W / 2, cy = H * .44;
  for (const c of O) {
    c.r = c.el.offsetWidth / 2;
    if (c.drag) { c.vx += (c.drag.px - c.x) * .03 - c.vx * .3; c.vy += (c.drag.py - c.y) * .03 - c.vy * .3; }   // пружина к пальцу: мягкая, шарик весомый и догоняет руку с запаздыванием
    else { const f = Math.hypot(c.vx, c.vy) < 1.5 ? .8 : FR; c.vx *= f; c.vy *= f; }   // медленное движение гасится быстро, бросок катится дольше
    if (Math.abs(c.vx) + Math.abs(c.vy) < .03 && !c.drag) { c.vx = c.vy = 0; }
    c.x += c.vx; c.y += c.vy;
    if (c.vx || c.vy || c.drag) c.live = true;
    if (c.live) {   // мягкий отскок от краёв поля
      if (c.x < c.r) { c.x = c.r; c.vx = Math.abs(c.vx) * BOUNCE; } else if (c.x > W - c.r) { c.x = W - c.r; c.vx = -Math.abs(c.vx) * BOUNCE; }
      if (c.y < c.r) { c.y = c.r; c.vy = Math.abs(c.vy) * BOUNCE; } else if (c.y > H - c.r) { c.y = H - c.r; c.vy = -Math.abs(c.vy) * BOUNCE; }
    }
  }
  // столкновения: только если хотя бы один шарик в движении — исходные «пары внахлёст» из макета не разлетаются сами
  for (let i = 0; i < O.length; i++) for (let j = i + 1; j < O.length; j++) {
    const a = O[i], b = O[j]; if (!(a.drag || b.drag || a.vx || a.vy || b.vx || b.vy)) continue;
    const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy) || .01, min = a.r + b.r + 2; if (d >= min) continue;
    const nx = dx / d, ny = dy / d, ma = a.r * a.r * (a.drag ? 2 : 1), mb = b.r * b.r * (b.drag ? 2 : 1), over = min - d;   // взятый шарик тяжелее, но соседи упираются
    const soft = over * .6;   // расталкивание по чуть-чуть каждый кадр — без резких «щелчков»
    a.x -= nx * soft * mb / (ma + mb); a.y -= ny * soft * mb / (ma + mb); b.x += nx * soft * ma / (ma + mb); b.y += ny * soft * ma / (ma + mb);
    const rv = (b.vx - a.vx) * nx + (b.vy - a.vy) * ny;
    if (a.drag || b.drag) {
      // удар взятым шаром: он как бита — сосед отпрыгивает со скоростью удара ×2,2 (минимум небольшой «отскок», даже при медленном касании)
