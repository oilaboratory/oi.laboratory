<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Brands, visual systems and design for businesses, cultural projects and people with ideas.">
<title>Oi.Lab</title>
<meta property="og:site_name" content="Oi.Lab">
<meta property="og:type" content="website">
<meta property="og:title" content="Design laboratory from Almaty">
<meta property="og:description" content="Brands, visual systems and design for businesses, cultural projects and people with ideas.">
<meta property="og:image" content="https://oilaboratory.com/img/og2.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" type="image/png" href="img/favicon3.png">
<link rel="apple-touch-icon" href="img/apple-touch-icon2.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tinos&display=swap">
<link rel="stylesheet" href="site.css?v=1793855590">
<style>
/* Главная: манифест и сетка проектов. Общие токены, шапка и футер — в site.css */

/* манифест */
.hero{padding-block:clamp(80px,18vw,240px);text-align:center;font-family:var(--serif);
  font-size:clamp(20px,2.17vw,32.5px);line-height:1.23;color:var(--hero);max-width:1350px;margin:0 auto}
.hero img,.hero video{display:inline-block;vertical-align:-0.15em}
.hero .wm{height:1.25em;margin-right:.15em}
.hero .nw{white-space:nowrap}
.hero .ppl{display:inline-block;position:relative;width:7.3em;height:1em;vertical-align:baseline;margin:0 -.2em}   /* иллюстрация в строке манифеста: крупная, выступает вверх, межстрочный интервал не меняется */
.hero br{display:none}
.hero br.hb{display:inline}   /* переносы строк как в макете (только компьютер) */
.hero .ppl > *{position:absolute;left:0;bottom:-.15em;display:block;width:100%;height:auto;aspect-ratio:1901/1049;mix-blend-mode:multiply}

/* проекты */
/* шапка сетки: слева «Проекты» и «Показать все», справа сферы деятельности клиентов */
.head{display:grid;grid-template-columns:repeat(4,1fr);column-gap:8px;align-items:start;padding-bottom:28px}
.head .ttl{display:grid;gap:14px;justify-items:start}
.head h2{margin:0;font-weight:500;font-size:clamp(22px,2vw,28px)}
.head a{font-size:13px;color:var(--muted);transition:color .25s}
.head a:hover{color:var(--ink)}
.head .va{display:flex;flex-wrap:wrap;align-items:center;gap:12px}
.cats{grid-column:2/-1;list-style:none;margin:0;padding:6px 0 0;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px 24px}
.cat{appearance:none;border:0;background:none;padding:0;font:inherit;font-size:13px;letter-spacing:-.03em;color:var(--muted);cursor:pointer;text-align:left;white-space:nowrap;transition:color .25s}
.cat:hover,.cat.is-on{color:var(--ink)}
.cat:disabled{color:var(--faint);cursor:default}   /* тег без проектов */
.cat:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
/* поведение как у mouthwash.studio/work: тайминги .25s (цвет) и .33s (фильтр), нажатие scale(.985) */
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:40px 8px;transition:opacity .33s}
.grid.is-fading{opacity:0}
.card[hidden]{display:none}
.card .media{position:relative;display:block;border-radius:4px;overflow:hidden}
.card .media img,.card .media video{display:block;width:100%;aspect-ratio:339/386;object-fit:cover;max-width:100%}
.card .media .hover{position:absolute;inset:0;height:100%;opacity:0;transition:opacity .5s ease;pointer-events:none}
.card .media .cover{transition:opacity .5s ease}
.card h3{margin:11px 0 0;font-size:12px;line-height:1.2;font-weight:500;letter-spacing:-.03em;color:var(--muted);transition:color .25s}
.tags{display:flex;flex-wrap:wrap;gap:2px;margin-top:5px}
.tag{appearance:none;border:0;border-radius:4px;font:inherit;font-size:9px;line-height:11px;letter-spacing:-.03em;padding:4px 5.4px;
  background:var(--chip);color:var(--muted);cursor:pointer;transition:color .25s,background-color .25s}
.tag:active,.filter:active{transform:scale(.985)}
.tag.is-on{color:var(--ink)}
.tag.field{color:var(--ink)}   /* сфера проекта — первой, тёмным; дальше что мы делали */
.filter{appearance:none;border:0;border-radius:8px;font:inherit;font-size:13px;letter-spacing:-.03em;padding:5px 8px;
  background:var(--chip);color:var(--muted);cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:color .25s,background-color .25s}
.filter svg{width:7px;height:7px}
@media (hover:hover){
  .card:hover h3{color:var(--ink)}
  .card .media:hover .hover{opacity:1}
  .card .media:hover:has(.hover) .cover{opacity:0}
  .tag:hover{color:var(--ink)}
  .filter:hover{color:var(--ink)}
}
.tag:focus-visible,.filter:focus-visible{outline:2px solid var(--ink);outline-offset:2px}


@media (max-width:1000px){.grid{grid-template-columns:repeat(2,1fr)}.head{grid-template-columns:1fr;row-gap:24px}.cats{grid-column:1;justify-content:flex-start;flex-wrap:wrap}}
.hero-art{display:none}
@media (max-width:767px){
  .hero{padding-block:48px 72px;text-align:left;font-size:24px;line-height:1.18}
  .hero-art{display:block;margin:0 -8px 28px}
  .hero-art video{display:block;width:100%;aspect-ratio:900/484;mix-blend-mode:multiply}
  .hero .ppl,.hero br,.hero br.hb{display:none}
  .hero .nw{white-space:normal}
  .grid{grid-template-columns:1fr;gap:44px}
  .cats{display:grid;grid-template-columns:1fr 1fr;gap:6px 8px}
}
 /* ещё работы: мелкие обложки 6 в ряд, без ссылки на кейс */
#more{margin-top:clamp(100px,12vw,180px)}
#more[hidden]{display:none}
.more-head{display:grid;grid-template-columns:repeat(4,1fr);column-gap:8px;padding-bottom:24px}
.more-head h2{margin:0;font-size:13px;font-weight:500;color:var(--muted)}
.more-head h2 .n{color:var(--faint);margin-left:4px}
.more-head p{grid-column:2/4;margin:0;font-size:13px;line-height:1.35;color:var(--muted);max-width:36em}
.grid.mini{grid-template-columns:repeat(6,1fr);gap:28px 8px}
.mcard{appearance:none;border:0;background:none;padding:0;font:inherit;text-align:left;cursor:pointer;color:var(--muted);display:block}
.mcard[hidden]{display:none}
.mcard .media{display:block;border-radius:4px;overflow:hidden}
.mcard img{display:block;width:100%;aspect-ratio:339/386;object-fit:cover;filter:saturate(.85);transition:filter .4s,transform .6s cubic-bezier(.23,1,.32,1)}
.mcard:hover img{filter:none;transform:scale(1.03)}
.mcard b{display:block;margin-top:8px;font-size:12px;font-weight:500;letter-spacing:-.03em;transition:color .25s}
.mcard small{display:block;font-size:11px;color:var(--faint)}
.mcard:hover b{color:var(--ink)}
.peek{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:24px;background:rgba(255,255,255,.3);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);animation:pk .35s ease}
.peek[hidden]{display:none}
@keyframes pk{from{opacity:0}}
.peek-card{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;width:min(820px,100%);background:#f7f8f9;border:1px solid var(--chip);border-radius:24px;padding:16px;box-shadow:0 30px 80px rgba(35,55,70,.12);animation:pk-up .5s cubic-bezier(.22,1.12,.36,1)}
@keyframes pk-up{from{opacity:0;transform:translateY(16px) scale(.97)}}
.peek-card img{width:100%;aspect-ratio:339/386;object-fit:cover;border-radius:12px;display:block}
.peek-b{display:flex;flex-direction:column;gap:10px;padding:8px 8px 4px}
.peek-b h3{margin:0;font-size:22px;font-weight:500;letter-spacing:-.02em;color:var(--ink)}
.peek-f{margin:0;font-size:13px;color:var(--muted)}
.peek-b p:not(.peek-f){margin:auto 0 0;font-size:15px;line-height:1.4;color:var(--ink)}
.peek-act{display:flex;gap:6px;margin-top:8px}
body .peek-act .nav-contact{background:var(--ink);color:#fff}
body .peek-act .nav-contact:hover{background:var(--ink);opacity:.85;color:#fff}
@media (max-width:1000px){.grid.mini{grid-template-columns:repeat(4,1fr)}.more-head{grid-template-columns:1fr;row-gap:8px}.more-head p{grid-column:1}}
@media (max-width:767px){.grid.mini{grid-template-columns:repeat(3,1fr);gap:20px 6px}.peek{align-items:end;padding:12px}.peek-card{grid-template-columns:1fr;border-radius:20px}.peek-card img{aspect-ratio:4/3}}
</style>

</head>
<body>
<!-- заставка при входе: название проявляется по буквам из размытия, потом страница; при входе и обновлении -->
<div id="intro" aria-hidden="true"></div>
<script>(function(){
  var el = document.getElementById('intro');
  // показываем при входе на сайт и при обновлении страницы; при переходе с других страниц сайта (Projects, логотип, «назад») — нет
  var nav = (performance.getEntriesByType && performance.getEntriesByType('navigation')[0] || {}).type;
  var internal = nav !== 'reload' && (nav === 'back_forward' || (document.referrer && new URL(document.referrer).origin === location.origin));
  if (internal || matchMedia('(prefers-reduced-motion: reduce)').matches) { el.remove(); return; }
  el.innerHTML = '<span>' + 'Oi.Laboratory'.split('').map(function(c, i){ return '<i style="animation-delay:' + (0.15 + i * 0.06).toFixed(2) + 's">' + c + '</i>'; }).join('') + '</span>';
  setTimeout(function(){ el.classList.add('out'); setTimeout(function(){ el.remove(); }, 700); }, 2100);
})();</script>
<header>
  <a class="logo" href="./" aria-label="Oi.Lab"><span class="mark"></span></a>
  <nav id="nav"></nav>
  <span class="right"><span class="langs"></span></span>
  <div class="fade" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
</header>

<div class="wrap">

  <section class="hero" id="top">
    <div class="hero-art" aria-hidden="true"><video src="img/hero-people.mp4" poster="img/hero-people-poster.jpg" autoplay muted loop playsinline></video></div>
    <div id="heroText"></div>
  </section>

  <section id="projects">
    <div class="head"><div class="ttl"><h2 data-i="projects">Projects</h2><span class="va"><a href="#projects" id="all" data-i="viewAll">Show all</a><span id="active"></span></span></div><ul class="cats" id="cats"></ul></div>
    <div class="grid" id="grid"></div>
  </section>

  <!-- ещё работы: проекты без готового кейса — мелкие обложки, по клику большая обложка и пояснение -->
  <section id="more">
    <div class="more-head"><h2><span data-i="more.title">More work</span> <span class="n" id="moreN"></span></h2><p data-i="more.note"></p></div>
    <div class="grid mini" id="mini"></div>
  </section>
  <div class="peek" id="peek" role="dialog" aria-modal="true" aria-labelledby="peek-t" hidden>
    <div class="peek-card"><img id="peek-img" alt=""><div class="peek-b"><h3 id="peek-t"></h3><p class="peek-f" id="peek-f"></p><p data-i="peek.text"></p>
      <div class="peek-act"><a class="pill nav-contact" href="#"><span data-i="peek.cta"></span></a><button class="pill peek-x" type="button" data-i="close"></button></div></div></div>
  </div>

  <footer id="contact"></footer>
</div>
<div class="big" id="big" role="img" aria-label="Oilab"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie_light.min.js"></script>
<script src="i18n.js?v=1793855590" charset="utf-8"></script>
<script src="projects.js?v=1793855590" charset="utf-8"></script>
<script>
// hover: вторая фотография проекта (или .mp4) — плавно сменяет обложку при наведении. Пример: {name:"Кайрат", img:"p01", hover:"img/p01-2.jpg", tags:[...]}
const grid = document.getElementById('grid'), mini = document.getElementById('mini');
const tagsOf = p => [p.field, ...(p.tags||[])].filter(Boolean).join('|');
grid.innerHTML = PROJECTS.filter(p => p.case).map(p => `
  <div class="card" data-tags="${tagsOf(p)}">
    <a href="case.html#${slug(p)}">
      <span class="media">
        <img class="cover" src="img/${p.img}.jpg" alt="${p.name}" loading="lazy">
        ${p.hover ? (/\.(mp4|webm)$/.test(p.hover)
          ? `<video class="hover" src="${p.hover}" muted loop playsinline autoplay></video>`
          : `<img class="hover" src="${p.hover.replace(/(\/[^/]+\/[^/]+)\.jpg$/, '$1-m.jpg')}" alt="" loading="lazy" decoding="async">`) : ''}
      </span>
      <h3>${p.name}</h3>
    </a>
    <div class="tags">${p.field ? `<button class="tag field" type="button" data-tag="${p.field}">${tr(p.field)}</button>` : ''}${(p.tags||[]).map(g=>`<button class="tag" type="button" data-tag="${g}">${tr(g)}</button>`).join('')}</div>
  </div>`).join('');
const MORE = PROJECTS.filter(p => !p.case);
mini.innerHTML = MORE.map((p, i) => `
  <button class="mcard" type="button" data-i-dx="${i}" data-tags="${tagsOf(p)}"><span class="media"><img src="img/${p.img}.jpg" alt="${p.name}" loading="lazy"></span><b>${p.name}</b>${p.field ? `<small data-field="${p.field}">${tr(p.field)}</small>` : ''}</button>`).join('');
document.getElementById('moreN').textContent = MORE.length;
// большая обложка поверх сайта: что это за проект и что кейс ещё упаковывается
const peek = document.getElementById('peek');
const peekShow = on => { peek.hidden = !on; document.documentElement.classList.toggle('bd-lock', on); };
mini.addEventListener('click', e => { const c = e.target.closest('.mcard'); if (!c) return; const p = MORE[c.dataset.iDx];
  document.getElementById('peek-img').src = `img/${p.img}.jpg`; document.getElementById('peek-t').textContent = p.name;
  document.getElementById('peek-f').textContent = p.field ? tr(p.field) : ''; peekShow(true); });
peek.addEventListener('click', e => { if (e.target === peek || e.target.closest('.peek-x, .nav-contact')) peekShow(false); });
addEventListener('keydown', e => { if (e.key === 'Escape' && !peek.hidden) peekShow(false); });

// клик по тегу фильтрует сетку: исчезает за .33s, перестраивается, проявляется; сверху плашка «тег ×»
const X = '<svg viewBox="0 0 8 9" fill="none"><path d="M1 1.25L7.5 7.75M7.5 1.25L1 7.75" stroke="currentColor"/></svg>';
let current = null;
function filter(tag){
  if (tag === current) return;
  current = tag;
  grid.classList.add('is-fading');
  setTimeout(() => {
    document.querySelectorAll('#grid .card, #mini .mcard').forEach(c => c.hidden = !!tag && !c.dataset.tags.split('|').includes(tag));
    document.getElementById('more').hidden = !!tag && !mini.querySelector('.mcard:not([hidden])');
    document.querySelectorAll('.tag, .cat').forEach(b => b.classList.toggle('is-on', b.dataset.tag === tag));
    document.getElementById('active').innerHTML = tag ? `<button class="filter" type="button" data-tag="${tag}">${tr(tag)}${X}</button>` : '';
    grid.classList.remove('is-fading');
  }, matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : 330);
}
grid.addEventListener('click', e => { const b = e.target.closest('.tag'); if (b) filter(b.dataset.tag); });
document.getElementById('active').addEventListener('click', e => { if (e.target.closest('.filter')) filter(null); });
document.getElementById('all').addEventListener('click', () => filter(null));
// сферы деятельности клиентов (FIELDS в i18n.js); сфера без проектов видна, но не нажимается
const USED = new Set(PROJECTS.map(p => p.field));
document.getElementById('cats').innerHTML = FIELDS.map(c =>
  `<li><button class="cat" type="button" data-tag="${c}"${USED.has(c) ? '' : ' disabled'}>${tr(c)}</button></li>`).join('');
document.getElementById('cats').addEventListener('click', e => { const b = e.target.closest('.cat'); if (b) filter(b.dataset.tag === current ? null : b.dataset.tag); });
// ссылка вида index.html#t-visual-identity (из паспорта кейса) сразу включает фильтр по тегу
const fromHash = PROJECTS.flatMap(p => [p.field, ...(p.tags||[])]).filter(Boolean).find(t => '#t-' + t.toLowerCase().replace(/[^a-z0-9]+/g,'-') === location.hash);
if (fromHash) { filter(fromHash); document.getElementById('projects').scrollIntoView(); }

// манифест: текст на выбранном языке, знак Oilab и анимация встраиваются в строку
const WM = '<img class="wm" src="img/wordmark.png" alt="Oilab">';
const ART = '<span class="ppl" id="ppl" aria-hidden="true"><video src="img/hero-people.mp4" poster="img/hero-people-poster.jpg" autoplay muted loop playsinline></video></span>';
window.pageRender = () => {
  // иллюстрация стоит в начале абзаца и плавает справа — текст обтекает её слева
  document.getElementById('heroText').innerHTML = t('hero').replace('{WM}', WM).replace('{ART}', ART);
  document.querySelectorAll('.tag, .filter, .cat').forEach(b => b.firstChild.textContent = tr(b.dataset.tag));
  document.querySelectorAll('.mcard small').forEach(s => s.textContent = tr(s.dataset.field));
};
pageRender();
siteChrome();

playLottie('big', 'img/footer-logo.json', 'img/footer-logo.png');   // подвал; без плеера — статичный логотип
</script>

</body>
</html>
