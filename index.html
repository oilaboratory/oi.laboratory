<html lang="en">
<head>
<meta charset="utf-8">

<title>Oi.Lab</title>

<meta property="og:type" content="website">
<meta property="og:title" content="Design laboratory from Almaty">
<meta property="og:description" content="Brands, visual systems and design for businesses, cultural projects and people with ideas.">
<meta property="og:image" content="https://oilaboratory.com/img/og2.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">

<style>
/* Главная: манифест и сетка проектов. Общие токены, шапка и футер — в site.css */

/* манифест */

/* проекты */
/* шапка сетки: «Проекты» в 1-й колонке, подпись «Сферы» в 3-й, сферы стопкой в 4-й (серым, выбранная — тёмным с ×, повторное нажатие сбрасывает) */
.head{display:grid;grid-template-columns:repeat(4,1fr);column-gap:8px;align-items:start;padding-bottom:40px}
html body div.head h2{color:var(--ink)}
html body div.head h2.sph{grid-column:3}
.cats{grid-column:4;display:flex;flex-direction:column;align-items:flex-start}
.cat{appearance:none;border:0;background:none;padding:0;margin:0;font:inherit;color:var(--muted);text-align:left;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:color .25s}
.cat:hover,.cat.is-on{color:var(--ink)}
.cat:disabled{color:var(--faint);cursor:default}
.cat svg{width:7px;height:7px}
.cat:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
/* поведение как у mouthwash.studio/work: тайминги .25s (цвет) и .33s (фильтр), нажатие scale(.985) */
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:40px 8px;transition:opacity .33s}
.grid.is-fading{opacity:0}
.card[hidden]{display:none}
.card .media{position:relative;display:block;border-radius:4px;overflow:hidden}
.card .media img,.card .media video{display:block;width:100%;aspect-ratio:339/386;object-fit:cover;max-width:100%}
.card .media .hover{position:absolute;inset:0;height:100%;opacity:0;transition:opacity .5s ease;pointer-events:none}
.card .media .cover{transition:opacity .5s ease}
.card h3{margin:11px 0 0;font-size:12px;line-height:1.2;font-weight:500;letter-spacing:-.03em;color:var(--muted);transition:color .25s}
.tags{display:flex;flex-wrap:wrap;gap:2px;margin-top:5px}
.tag{appearance:none;border:0;border-radius:4px;font:inherit;font-size:9px;line-height:11px;letter-spacing:-.03em;padding:4px 5.4px;
  background:var(--chip);color:var(--muted);cursor:pointer;transition:color .25s,background-color .25s}
.tag:active,.filter:active{transform:scale(.985)}
.tag.is-on{color:var(--ink)}
.filter{appearance:none;border:0;border-radius:8px;font:inherit;font-size:13px;letter-spacing:-.03em;padding:5px 8px;
  background:var(--chip);color:var(--muted);cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:color .25s,background-color .25s}
.filter svg{width:7px;height:7px}
@media (hover:hover){
  .card:hover h3{color:var(--ink)}
  .card .media:hover .hover{opacity:1}
  .card .media:hover:has(.hover) .cover{opacity:0}
  .tag:hover{color:var(--ink)}
  .filter:hover{color:var(--ink)}
}
.tag:focus-visible,.filter:focus-visible{outline:2px solid var(--ink);outline-offset:2px}


@media (max-width:1000px){.grid{grid-template-columns:repeat(2,1fr)}.head{grid-template-columns:repeat(2,1fr);row-gap:24px}.head h2:first-child{grid-column:1/-1}html body div.head h2.sph{grid-column:1}.cats{grid-column:2}}
@media (max-width:767px){
  .grid{grid-template-columns:1fr;gap:44px}
}
 /* кнопка «Ещё проекты» под кейсами и слой со всеми остальными проектами */
.more-wrap{display:flex;justify-content:center;margin-top:56px}
body .more-btn{height:34px;padding:0 18px;border-radius:17px}
.more-btn .n{color:var(--muted)}
@media (max-width:767px){
}
/* первый экран (черновик 2), по макету 1500×934: знак Oilab · иллюстрация · «Превращаем бизнес в бренд», под ним текст и услуги.
   Размеры — в долях ширины экрана, как в макете. При наведении на заголовок буквы возле курсора превращаются в стикеры (как на wabi.ai) */
.h2{position:relative;display:grid;grid-template-columns:20.2vw 22.3vw 1fr;grid-template-rows:auto auto;column-gap:.8vw;align-content:center;min-height:calc(100svh - 62px);padding-bottom:6vw}
/* знак, иллюстрация и заголовок стоят на одной линии: низ знака = линия пола на иллюстрации = базовая линия заголовка */
.h2-wm{grid-area:1/1;align-self:end;display:block;width:100%;height:auto}
.h2-art{grid-area:1/2;align-self:end;position:relative;display:block;isolation:isolate;margin-bottom:-.6vw}   /* под линией пола в ролике ~2.7% пустоты */
.h2-art video{display:block;width:100%;height:auto;aspect-ratio:1920/1056}
.h2-art::after{content:"";position:absolute;inset:0;background:var(--ink);mix-blend-mode:screen;pointer-events:none}   /* чёрные линии → цвет текста сайта */
html body .h2-t{grid-area:1/3;align-self:end;margin:0 0 -.21em;font-size:3.47vw;line-height:1;letter-spacing:-.02em!important;color:var(--ink);white-space:nowrap;cursor:default}
.h2-sub{grid-area:2/3;display:grid;grid-template-columns:31.2vw 1fr;column-gap:3.6vw;margin-top:1.6vw}
html body .h2-sub :is(p,ul){margin:0;font-size:max(12px,.95vw);line-height:1.25;color:var(--ink)}
.h2-sub ul{list-style:none;padding:0;line-height:1.38}
/* след из стикеров в пустых местах первого экрана */
.h2 .tr{position:absolute;z-index:1;width:1em;height:1em;margin:-.5em 0 0 -.5em;font-style:normal;line-height:1;text-align:center;pointer-events:none;
  animation:trIn .32s cubic-bezier(.16,1.42,.4,1) both;filter:drop-shadow(0 .15em .15em rgba(20,18,14,.15))}
.h2 .tr.out{animation:trOut .38s cubic-bezier(.45,0,.75,.35) both}
@keyframes trIn{from{opacity:0;transform:scale(.3) rotate(0)}to{opacity:1;transform:scale(1) rotate(var(--r))}}
@keyframes trOut{from{opacity:1;transform:scale(1) rotate(var(--r))}to{opacity:0;transform:scale(.2) rotate(var(--r))}}
/* буква-стикер: при включении буква сжимается и гаснет, на её месте «прыгает» стикер с лёгким поворотом */
.h2-t .w{display:inline-block;white-space:nowrap}
.h2-t .ch{position:relative;display:inline-block;transition:width .38s cubic-bezier(.22,.8,.28,1)}
.h2-t .g{display:inline-block;font-style:normal;transition:opacity .15s linear,transform .24s cubic-bezier(.22,.8,.28,1)}
.h2-t .o{position:absolute;left:50%;top:50%;width:1em;height:1em;margin:-.52em 0 0 -.5em;font-style:normal;font-size:.92em;line-height:1;text-align:center;opacity:0;pointer-events:none;
  transform:translateY(.25em) rotate(var(--r0)) scale(.4);filter:drop-shadow(0 .18em .2em rgba(20,18,14,.18));
  transition:transform .46s cubic-bezier(.45,0,.75,.35),opacity .13s linear}
.h2-t .ch.on .g{opacity:0;transform:scale(.34)}
.h2-t .ch.on .o{opacity:1;transform:rotate(var(--r)) scale(1);transition:transform .46s cubic-bezier(.16,1.42,.4,1),opacity .13s linear}
@media (max-width:767px){
  .h2{grid-template-columns:1fr 1fr;grid-template-rows:auto;row-gap:12px;padding-block:24px 64px;min-height:0}
  .h2-art{margin-bottom:-1%}
  html body .h2-t{grid-area:2/1/3/3;margin:12px 0 0}
  .h2-sub{grid-area:3/1/4/3}
  html body .h2-t{font-size:8.4vw;line-height:1.05;white-space:normal}
  .h2-sub{grid-template-columns:1fr;row-gap:16px;margin-top:16px}
  html body .h2-sub :is(p,ul){font-size:var(--fs-body)}
}
</style>

</head>
<body>
<!-- заставка при входе: название проявляется по буквам из размытия, потом страница; при входе и обновлении -->
<div id="intro" aria-hidden="true"></div>
<script>(function(){
  var el = document.getElementById('intro');
  // показываем при входе на сайт и при обновлении страницы; при переходе с других страниц сайта (Projects, логотип, «назад») — нет
  var nav = (performance.getEntriesByType && performance.getEntriesByType('navigation')[0] || {}).type;
  var internal = nav !== 'reload' && (nav === 'back_forward' || (document.referrer && new URL(document.referrer).origin === location.origin));
  if (internal || matchMedia('(prefers-reduced-motion: reduce)').matches) { el.remove(); return; }
  el.innerHTML = '<span>' + 'Oi.Laboratory'.split('').map(function(c, i){ return '<i style="animation-delay:' + (0.15 + i * 0.06).toFixed(2) + 's">' + c + '</i>'; }).join('') + '</span>';
  setTimeout(function(){ el.classList.add('out'); setTimeout(function(){ el.remove(); }, 700); }, 2100);
})();</script>
<header>
  <a class="logo" href="./" aria-label="Oi.Lab"><span class="mark"></span></a>
  <nav id="nav"></nav>
  <span class="right"><span class="langs"></span></span>
  <div class="fade" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
</header>

<div class="wrap">

  <section class="h2" id="top">
    <img class="h2-wm" src="img/wordmark.png" alt="Oilab">
    <span class="h2-art" aria-hidden="true"><video src="img/people-hd2.mp4" poster="img/people-hd2.jpg" autoplay muted loop playsinline></video></span>
    <h1 class="h2-t" id="h2t"></h1>
    <div class="h2-sub"><p data-i="h2.lead"></p><ul id="h2svc"></ul></div>
  </section>

  <section id="projects">
    <div class="head"><h2 data-i="projects">Projects</h2><h2 class="sph" data-i="spheres">Spheres</h2><div class="cats" id="cats"></div></div>
    <div class="grid" id="grid"></div>
    <div class="more-wrap"><a class="pill more-btn" href="more.html" id="moreBtn"><span data-i="more.title">More projects</span> <span class="n" id="moreN"></span></a></div>
  </section>


  <footer id="contact"></footer>
</div>
<div class="big" id="big" role="img" aria-label="Oilab"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie_light.min.js"></script>
<script src="i18n.js?v=1794069219" charset="utf-8"></script>
<script src="projects.js?v=1794069219" charset="utf-8"></script>
<script>
// hover: вторая фотография проекта (или .mp4) — плавно сменяет обложку при наведении. Пример: {name:"Кайрат", img:"p01", hover:"img/p01-2.jpg", tags:[...]}
const grid = document.getElementById('grid');
const tagsOf = p => [...fieldsOf(p), ...(p.tags||[])].filter(Boolean).join('|');
grid.innerHTML = PROJECTS.filter(p => p.case).map(p => `
  <div class="card" data-tags="${tagsOf(p)}">
    <a href="case.html#${slug(p)}">
      <span class="media">
        <img class="cover" src="img/${p.img}.jpg" alt="${p.name}" loading="lazy">
        ${p.hover ? (/\.(mp4|webm)$/.test(p.hover)
          ? `<video class="hover" src="${p.hover}" muted loop playsinline autoplay></video>`
          : `<img class="hover" src="${p.hover.replace(/(\/[^/]+\/[^/]+)\.jpg$/, '$1-m.jpg')}" alt="" loading="lazy" decoding="async">`) : ''}
      </span>
      <h3>${p.name}</h3>
    </a>
    <div class="tags">${fieldsOf(p).map(f => `<button class="tag field" type="button" data-tag="${f}">${tr(f)}</button>`).join('')}${(p.tags||[]).map(g=>`<button class="tag" type="button" data-tag="${g}">${tr(g)}</button>`).join('')}</div>
  </div>`).join('');
// проекты без открытого кейса: в сетке появляются только при выборе сферы/тега, клик ведёт на «Ещё проекты» и открывает карточку
const MORE = PROJECTS.filter(p => !p.case);
grid.insertAdjacentHTML('beforeend', MORE.map((p, i) => `
  <div class="card extra soon" data-tags="${tagsOf(p)}" hidden>
    <a href="more.html#k-${i}">
      <span class="media"><img class="cover" src="img/${p.img}.jpg" alt="${p.name}" loading="lazy"><span class="soon-pill">${t('soon')}</span></span>
      <h3>${p.name}</h3>
    </a>
    <div class="tags">${fieldsOf(p).map(f => `<button class="tag field" type="button" data-tag="${f}">${tr(f)}</button>`).join('')}${(p.tags||[]).map(g=>`<button class="tag" type="button" data-tag="${g}">${tr(g)}</button>`).join('')}</div>
  </div>`).join(''));
document.getElementById('moreN').textContent = MORE.length;

// клик по тегу фильтрует сетку: исчезает за .33s, перестраивается, проявляется; сверху плашка «тег ×»
const X = '<svg viewBox="0 0 8 9" fill="none"><path d="M1 1.25L7.5 7.75M7.5 1.25L1 7.75" stroke="currentColor"/></svg>';
let current = null;
function filter(tag){
  if (tag === current) return;
  current = tag;
  grid.classList.add('is-fading');
  setTimeout(() => {
    grid.querySelectorAll('.card').forEach(c => c.hidden = tag ? !c.dataset.tags.split('|').includes(tag) : c.classList.contains('extra'));
    renderCats();
    grid.querySelectorAll('.tag').forEach(b => b.classList.toggle('is-on', b.dataset.tag === tag));
    grid.classList.remove('is-fading');
  }, matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : 330);
}
grid.addEventListener('click', e => { const b = e.target.closest('.tag'); if (b) filter(b.dataset.tag); });
// список: сферы деятельности (FIELDS в i18n.js); если выбран тег услуги с карточки — он добавляется плашкой с ×
function renderCats(){
  const pill = (tag, label, on) => `<button class="cat${on ? ' is-on' : ''}" type="button" data-tag="${tag}">${label}${on ? X : ''}</button>`;
  document.getElementById('cats').innerHTML = FIELDS.map(f => pill(f, tr(f), current === f)).join('')
    + (current && !FIELDS.includes(current) ? pill(current, tr(current), true) : '');
}
renderCats();
document.getElementById('cats').addEventListener('click', e => { const b = e.target.closest('.cat'); if (b) filter(!b.dataset.tag || b.dataset.tag === current ? null : b.dataset.tag); });
// ссылка вида index.html#t-visual-identity (из паспорта кейса) сразу включает фильтр по тегу
const fromHash = PROJECTS.flatMap(p => [...fieldsOf(p), ...(p.tags||[])]).filter(Boolean).find(t => '#t-' + t.toLowerCase().replace(/[^a-z0-9]+/g,'-') === location.hash);
if (fromHash) { filter(fromHash); document.getElementById('projects').scrollIntoView(); }

// заголовок первого экрана: каждая буква — ячейка; возле курсора буквы превращаются в стикеры-эмодзи (как на wabi.ai)
// стикеры — обычные эмодзи: на iPhone и Mac это эмодзи Apple (картинки Apple вставлять нельзя), на Android — свои
const STICK = ['🎨','✏️','📐','🖌️','✂️','📎','🖍️','💡','✨','📏','🖼️','🪄','📌','☕️','🎯','🧩','💬','🔥','⭐️','🍀','🫶','👀','🚀','🌈'];
const h2t = document.getElementById('h2t');
const renderH2 = () => {
  const words = t('h2.title').split(' ');
  h2t.setAttribute('aria-label', t('h2.title'));
  h2t.innerHTML = words.map(w => `<span class="w" aria-hidden="true">${[...w].map(c => c.trim() ? `<span class="ch"><i class="g">${c}</i><i class="o"></i></span>` : '&nbsp;').join('')}</span>`).join(' ');
};
const stickOn = (ch, on) => {
  if (ch.classList.contains('on') === on) return;
  const o = ch.lastChild;
  if (on) { o.textContent = STICK[Math.random() * STICK.length | 0]; o.style.setProperty('--r', (Math.random() * 24 - 12).toFixed(1) + 'deg'); o.style.setProperty('--r0', (Math.random() * 60 - 30).toFixed(1) + 'deg'); }
  ch.classList.toggle('on', on);
};
// буквы ближе ~0.7em к курсору — стикеры; курсор ушёл — снова буквы
h2t.addEventListener('pointermove', e => {
  const fs = parseFloat(getComputedStyle(h2t).fontSize);
  h2t.querySelectorAll('.ch').forEach(ch => { const r = ch.getBoundingClientRect(); stickOn(ch, Math.abs(e.clientX - (r.left + r.width / 2)) < fs * .7 && e.clientY > r.top - fs * .2 && e.clientY < r.bottom + fs * .2); });
});
h2t.addEventListener('pointerleave', () => h2t.querySelectorAll('.ch.on').forEach(ch => stickOn(ch, false)));
// в пустых местах первого экрана курсор оставляет след из стикеров: через каждые ~34px пути — эмодзи, который «выпрыгивает»,
// держится ~0,7 с и исчезает, так что хвост тает по порядку (как в референсе)
const hero = document.getElementById('top');
let lx = null, ly = 0;
if (matchMedia('(hover:hover)').matches && !matchMedia('(prefers-reduced-motion: reduce)').matches) {
  hero.addEventListener('pointermove', e => {
    if (e.target.closest('#h2t')) { lx = null; return; }
    const b = hero.getBoundingClientRect(), x = e.clientX - b.left, y = e.clientY - b.top;
    if (lx === null) { lx = x; ly = y; }
    const d = Math.hypot(x - lx, y - ly), STEP = 34;
    for (let k = STEP; k <= d; k += STEP) {
      const px = lx + (x - lx) * k / d, py = ly + (y - ly) * k / d, el = document.createElement('i');
      el.className = 'tr'; el.textContent = STICK[Math.random() * STICK.length | 0];
      el.style.cssText = `left:${px}px;top:${py}px;--r:${(Math.random() * 30 - 15).toFixed(0)}deg;font-size:${(22 + Math.random() * 10).toFixed(0)}px`;
      hero.appendChild(el); setTimeout(() => el.classList.add('out'), 700); setTimeout(() => el.remove(), 1100);
    }
    if (d >= STEP) { const k = Math.floor(d / STEP) * STEP / d; lx += (x - lx) * k; ly += (y - ly) * k; }
  });
  hero.addEventListener('pointerleave', () => { lx = null; });
}
window.pageRender = () => {
  renderH2();
  document.getElementById('h2svc').innerHTML = t('h2.svc').map(x => `<li>${x}</li>`).join('');
  document.querySelectorAll('.tag').forEach(b => b.firstChild.textContent = tr(b.dataset.tag));
  renderCats();
};
pageRender();
siteChrome();

playLottie('big', 'img/footer-logo.json', 'img/footer-logo.png');   // подвал; без плеера — статичный логотип
</script>

</body>
</html>
