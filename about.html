<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>About Us – Oi.Lab</title>
<meta property="og:site_name" content="Oi.Lab">
<meta property="og:type" content="website">
<meta property="og:title" content="About Us">
<meta property="og:description" content="Brands, visual systems and design for businesses, cultural projects and people with ideas.">
<meta property="og:image" content="https://oilaboratory.com/img/og2.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" type="image/png" href="img/favicon3.png">
<link rel="apple-touch-icon" href="img/apple-touch-icon2.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tinos&display=swap">
<link rel="stylesheet" href="site.css?v=1794068919">
<style>
/* About 1:1 по gaadesign.studio/info/about (замеры при 1440 и 375 px): размеры, интерлиньяж, трекинг −0.5px, отступы.
   Цвета — палитра сайта: тёмный --ink вместо чёрного, бледный --faint вместо #d8d8d8. Блок основателя и «Процесс» убраны, вместо основателя — команда */
html body main.ab,html body main.ab *{letter-spacing:-.5px!important}
main.ab{padding-top:116px;padding-bottom:120px}
html body main.ab .lbl{font-size:18px;line-height:1.1;color:var(--ink);margin:0 0 16px}
html body main.ab .st{font-size:36px;line-height:1;color:var(--ink);margin:0}
.st + .st{margin-top:36px}
.studio{padding-bottom:120px}
.blk{padding-bottom:120px}
.team{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:40px 8px}
html body main.ab .team h3{margin:0 0 10px;font-size:13px;line-height:1.3;color:var(--muted)}
.team h3 b,.team h3 span{display:block}
.team h3 b{color:var(--ink)}
.team img{display:block;width:100%;height:auto;aspect-ratio:900/1205;object-fit:cover;border-radius:4px;background:var(--chip)}
html body main.ab .team p{margin:12px 0 0;font-size:14px;line-height:1.35;color:var(--ink);max-width:26em}

html body main.ab .big-h{font-size:44px;line-height:1.1;letter-spacing:-.88px!important;color:var(--ink);text-align:center;margin:0 0 65px}
.studio .lbl::after,.big-h::after{content:":"}
/* принципы по GAA: строки между линиями, все заголовки бледные; наведение — темнее и появляется эмодзи;
   нажатие раскрывает текст справа от заголовка, с середины экрана (на телефоне — под заголовком) (открыт один, повторное нажатие закрывает) */
#principles{border-top:1px solid var(--faint)}
.pr{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);column-gap:8px;align-items:start;border-bottom:1px solid var(--faint)}
html body main.ab .pr-h{grid-column:1;display:block;width:100%;appearance:none;border:0;background:none;padding:18px 0;margin:0;font:inherit;font-size:32px;line-height:1;text-align:left;color:var(--faint);cursor:pointer;transition:color .3s}
.pr{cursor:pointer}
html body main.ab .pr:hover .pr-h{color:var(--muted)}   /* вся строка — зона наведения и нажатия */
html body main.ab .pr.open .pr-h{color:var(--ink)}
.pr-h .em{display:inline-block;opacity:0;transform:scale(.6);transition:opacity .3s,transform .4s cubic-bezier(.34,1.56,.64,1)}
.pr:hover .em,.pr.open .em{opacity:1;transform:none}
.pr-d{grid-column:2;display:grid;grid-template-rows:0fr;opacity:0;transition:grid-template-rows .5s cubic-bezier(.23,1,.32,1),opacity .3s}
html body main.ab .pr-d > p{overflow:hidden;margin:0;font-size:22px;line-height:1.1;color:var(--ink)}
.pr.open .pr-d{grid-template-rows:1fr;opacity:1;transition:grid-template-rows .5s cubic-bezier(.23,1,.32,1),opacity .5s .1s}
.pr.open .pr-d > p{padding:20px 0 18px}   /* верх текста — по верху заголовка */

/* низ: три колонки 715 / 237 / 280 с зазором 56 (как у GAA при 1440), всё 18/19.8, списки бледные */
.cols{display:grid;grid-template-columns:minmax(0,715fr) minmax(0,237fr) minmax(0,280fr);gap:56px;padding-top:24px}
html body main.ab .cols .lbl{margin-bottom:15px}
html body main.ab .list{display:block;margin:0;font-size:18px;line-height:1.1;color:var(--faint)}
html body main.ab .list > *{display:block;font-size:inherit;line-height:inherit}
.list a:hover{color:var(--ink)}

@media (max-width:767px){
  main.ab{padding-top:84px;padding-bottom:80px}
  html body main.ab .lbl{font-size:14px;line-height:1.1}
  html body main.ab .st{font-size:24px}
  .st + .st{margin-top:24px}
  .studio,.blk{padding-bottom:80px}
  .team{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  html body main.ab .big-h{font-size:48px;line-height:1;letter-spacing:-1px!important;margin-bottom:48px}
  /* телефон: те же строки с линиями, заголовки 18, текст 14 */
  .pr{grid-template-columns:1fr}
  .pr-d{grid-column:1}
  html body main.ab .pr-h{font-size:18px;padding:14px 0}
  html body main.ab .pr-d > p{font-size:14px;line-height:1.1}
  .pr.open .pr-d > p{padding:0 0 16px}
  /* низ: услуги | признание, клиенты ниже в две колонки; подписи 12/13.2, пункты 14/15.4 */
  .cols{grid-template-columns:1fr 1fr;gap:40px 10px;padding-top:46px}
  .cols > :nth-child(2){grid-column:1/-1;order:3}
  html body main.ab .cols .lbl{font-size:12px;margin-bottom:20px}
  html body main.ab .list{font-size:14px}
  #clients{column-count:2;column-gap:10px}
}
</style>
</head>
<body class="project">
<header id="hdr">
  <a class="logo" href="./" aria-label="Oi.Lab"><span class="mark"></span></a>
  <nav id="nav"></nav>
  <span class="right"><span class="langs"></span></span>
  <div class="fade" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
</header>

<main class="ab">
  <section class="studio">
    <h2 class="lbl" data-i="a.studio"></h2>
    <p class="st" data-i="a.studioText"></p>
    <p class="st" data-i="a.studioText2"></p>
  </section>
  <section class="blk">
    <h2 class="lbl" data-i="a.founder"></h2>
    <div class="team" id="team"></div>
  </section>
  <section>
    <h2 class="big-h" data-i="a.principles"></h2>
    <div id="principles"></div>
  </section>
  <section class="cols">
    <div><h2 class="lbl" data-i="a.services"></h2><div class="list" id="services"></div></div>
    <div><h2 class="lbl" data-i="a.clients"></h2><div class="list" id="clients"></div></div>
    <div><h2 class="lbl" data-i="a.recognition"></h2><p class="list" data-i="a.recognitionText"></p></div>
  </section>
</main>

<footer id="contact"></footer>
<div class="big" id="big" role="img" aria-label="Oilab"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie_light.min.js"></script>
<script src="i18n.js?v=1794068919" charset="utf-8"></script>
<script src="projects.js?v=1794068919" charset="utf-8"></script>
<script>
// Тексты страницы — в i18n.js (ключи a.*)

const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
window.pageRender = () => {
  const EM = ['🔬', '🌍', '📐', '🔍', '💍', '❤️'];   // как у GAA: эмодзи текстом после заголовка — на iPhone/Mac это эмодзи Apple
  const box = document.getElementById('principles'), cur = box.querySelector('.pr.open'), on = cur ? [...box.children].indexOf(cur) : -1;
  box.innerHTML = t('a.principleList').map(([h, d], i) =>
    `<div class="pr${i === on ? ' open' : ''}"><button class="pr-h" type="button" aria-expanded="${i === on}">${esc(h)} <span class="em">${EM[i]}</span></button><div class="pr-d"><p>${esc(d)}</p></div></div>`).join('');
  const PHOTO = ['aibyn', 'konstantin', 'raim', 'tolegen'];
  document.getElementById('team').innerHTML = t('a.team').map(([n, r, d], i) =>
    `<figure style="margin:0"><h3><b>${esc(n)}</b><span>${esc(r)}</span></h3><img src="img/team/${PHOTO[i]}.jpg" alt="${esc(n)}" width="900" height="1205" loading="lazy"><p>${esc(d)}</p></figure>`).join('');
  document.getElementById('services').innerHTML = t('a.serviceList').map(x => `<span>${esc(x)}</span>`).join('');
};
pageRender();
// принципы: нажатие открывает пункт, остальные закрываются
document.getElementById('principles').addEventListener('click', e => {
  const r = e.target.closest('.pr'); if (!r) return; const h = r.querySelector('.pr-h');
  document.querySelectorAll('#principles .pr').forEach(p => { const on = p === h.parentElement && !p.classList.contains('open'); p.classList.toggle('open', on); p.querySelector('.pr-h').setAttribute('aria-expanded', on); });
});
document.getElementById('clients').innerHTML = PROJECTS.filter(p => !/^Проект/.test(p.name))
  .map(p => p.case ? `<a href="case.html#${slug(p)}">${esc(p.name)}</a>` : `<span>${esc(p.name)}</span>`).join('');

siteChrome();
playLottie('big', 'img/footer-logo.json', 'img/footer-logo.png');
</script>
</body>
</html>
