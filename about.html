<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>About Us — Oi.Lab</title>
<meta property="og:site_name" content="Oi.Lab">
<meta property="og:type" content="website">
<meta property="og:title" content="About Us">
<meta property="og:description" content="Brands, visual systems and design for businesses, cultural projects and people with ideas.">
<meta property="og:image" content="https://oilaboratory.com/img/og2.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" type="image/png" href="img/favicon3.png">
<link rel="apple-touch-icon" href="img/apple-touch-icon2.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tinos&display=swap">
<link rel="stylesheet" href="site.css?v=1793859131">
<style>
/* About 1:1 по gaadesign.studio/info/about (без блока основателя и «Процесса»): «Студия:» + крупный текст → команда → «Принципы:» по центру,
   заголовки слева, описание открытого справа → три колонки: услуги, клиенты, признание. Сетка сайта — 4 колонки */
main{padding-bottom:clamp(60px,8vw,120px)}
html body .lbl{font-size:var(--fs-cap);line-height:1.3;color:var(--ink);margin:0 0 16px}
.studio{padding-block:clamp(80px,14vw,200px) clamp(60px,8vw,120px)}
.studio p.lead{margin:0;max-width:none;color:var(--ink)}
.studio p.lead + p.lead{margin-top:.6em}
.blk{padding-block:0 clamp(80px,10vw,160px)}
.team{grid-column:1/-1;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:40px 8px}
.team h3{margin:0 0 10px;font-size:13px;font-weight:400;line-height:1.3;color:var(--muted)}
.team h3 b,.team h3 span{display:block}
.team h3 b{color:var(--ink)}
.team img{display:block;width:100%;height:auto;aspect-ratio:900/1205;object-fit:cover;border-radius:4px;background:var(--chip)}
.team p{margin:12px 0 0;font-size:14px;line-height:1.35;color:var(--ink);max-width:26em}

html body .big-h{font-size:clamp(30px,3.05vw,44px);line-height:1.1;color:var(--ink);text-align:center;margin:0 0 clamp(40px,4vw,64px)}
.studio .lbl::after,.big-h::after{content:":"}
/* принцип: заголовок с эмодзи в колонках 1–2, описание открытого — в 3–4; остальные заголовки бледные */
.pr{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));column-gap:8px;align-items:start}
.pr-h{grid-column:1/3;appearance:none;border:0;background:none;padding:0 0 32px;margin:0;font:inherit;text-align:left;color:var(--faint);cursor:pointer;transition:color .4s cubic-bezier(.23,1,.32,1)}
.pr-h:hover,.pr.open .pr-h{color:var(--ink)}
.pr-d{grid-column:3/5;display:grid;grid-template-rows:0fr;opacity:0;transition:grid-template-rows .5s cubic-bezier(.23,1,.32,1),opacity .35s}
.pr-d > p{overflow:hidden;margin:0;color:var(--ink)}
.pr.open .pr-d{grid-template-rows:1fr;opacity:1;transition:grid-template-rows .5s cubic-bezier(.23,1,.32,1),opacity .5s .1s}
.pr.open .pr-d > p{padding-bottom:32px}

/* низ: услуги (бледным списком), клиенты, признание — по строке на пункт */
.cols{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:40px 8px}
.cols > :first-child{grid-column:1/3}
.list{display:flex;flex-direction:column;align-items:flex-start;color:var(--ink);margin:0}
.list.pale{color:var(--faint)}
.list a:hover{color:var(--muted)}

@media (max-width:767px){
  .team{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  html body .big-h{text-align:left}
  /* телефон, как у GAA: список с линиями, описание открытого пункта — под заголовком */
  .pr{grid-template-columns:1fr;border-top:1px solid var(--chip)}
  .pr:last-child{border-bottom:1px solid var(--chip)}
  .pr-h,.pr-d{grid-column:1}
  .pr-h{width:100%;padding:16px 0;color:var(--muted)}
  .pr.open .pr-d > p{padding:0 0 20px}
  .cols{grid-template-columns:1fr 1fr}
  .cols > :first-child,.cols > :last-child{grid-column:1/-1}
}
</style>
</head>
<body class="project">
<header id="hdr">
  <a class="logo" href="./" aria-label="Oi.Lab"><span class="mark"></span></a>
  <nav id="nav"></nav>
  <span class="right"><span class="langs"></span></span>
  <div class="fade" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
</header>

<main>
  <section class="studio">
    <h2 class="lbl" data-i="a.studio"></h2>
    <p class="lead" data-i="a.studioText"></p>
    <p class="lead" data-i="a.studioText2"></p>
  </section>
  <section class="blk">
    <h2 class="lbl" data-i="a.founder"></h2>
    <div class="team" id="team"></div>
  </section>
  <section class="blk">
    <h2 class="big-h" data-i="a.principles"></h2>
    <div id="principles"></div>
  </section>
  <section class="cols">
    <div><h2 class="lbl" data-i="a.services"></h2><div class="list pale" id="services"></div></div>
    <div><h2 class="lbl" data-i="a.clients"></h2><div class="list" id="clients"></div></div>
    <div><h2 class="lbl" data-i="a.recognition"></h2><p class="list pale" data-i="a.recognitionText"></p></div>
  </section>
</main>

<footer id="contact"></footer>
<div class="big" id="big" role="img" aria-label="Oilab"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie_light.min.js"></script>
<script src="i18n.js?v=1793859131" charset="utf-8"></script>
<script src="projects.js?v=1793859131" charset="utf-8"></script>
<script>
// Тексты страницы — в i18n.js (ключи a.*)

const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
window.pageRender = () => {
  const EM = ['🔬', '🌍', '📐', '🔍', '💍', '❤️'];   // как у GAA: эмодзи текстом после заголовка — на iPhone/Mac это эмодзи Apple
  const box = document.getElementById('principles'), cur = box.querySelector('.pr.open'), on = cur ? [...box.children].indexOf(cur) : 0;
  box.innerHTML = t('a.principleList').map(([h, d], i) =>
    `<div class="pr${i === on ? ' open' : ''}"><button class="pr-h" type="button" aria-expanded="${i === on}">${esc(h)} ${EM[i]}</button><div class="pr-d"><p>${esc(d)}</p></div></div>`).join('');
  const PHOTO = ['aibyn', 'konstantin', 'raim', 'tolegen'];
  document.getElementById('team').innerHTML = t('a.team').map(([n, r, d], i) =>
    `<figure style="margin:0"><h3><b>${esc(n)}</b><span>${esc(r)}</span></h3><img src="img/team/${PHOTO[i]}.jpg" alt="${esc(n)}" width="900" height="1205" loading="lazy"><p>${esc(d)}</p></figure>`).join('');
  document.getElementById('services').innerHTML = t('a.serviceList').map(x => `<span>${esc(x)}</span>`).join('');
};
pageRender();
// принципы: нажатие открывает пункт, остальные закрываются
document.getElementById('principles').addEventListener('click', e => {
  const h = e.target.closest('.pr-h'); if (!h) return;
  document.querySelectorAll('#principles .pr').forEach(p => { const on = p === h.parentElement; p.classList.toggle('open', on); p.querySelector('.pr-h').setAttribute('aria-expanded', on); });
});
document.getElementById('clients').innerHTML = PROJECTS.filter(p => !/^Проект/.test(p.name))
  .map(p => p.case ? `<a href="case.html#${slug(p)}">${esc(p.name)}</a>` : `<span>${esc(p.name)}</span>`).join('');

siteChrome();
playLottie('big', 'img/footer-logo.json', 'img/footer-logo.png');
</script>
</body>
</html>
