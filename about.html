<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>About Us — Oi.Lab</title>
<meta property="og:site_name" content="Oi.Lab">
<meta property="og:type" content="website">
<meta property="og:title" content="About Us">
<meta property="og:description" content="Brands, visual systems and design for businesses, cultural projects and people with ideas.">
<meta property="og:image" content="https://oilaboratory.com/img/og2.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" type="image/png" href="img/favicon3.png">
<link rel="apple-touch-icon" href="img/apple-touch-icon2.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tinos&display=swap">
<link rel="stylesheet" href="site.css?v=1793816183">
<style>
/* About по структуре gaadesign.studio/info/about: студия → основатель → принципы (раскрываются) → услуги → клиенты → признание → контакт.
   Сетка сайта: подпись раздела в первой колонке из 4, содержание — в колонках 2–4 */
.sec{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding-block:28px 64px;border-top:1px solid var(--chip)}
.sec > h2{font-size:13px;font-weight:400;color:var(--muted);margin:0}
.sec > .body{grid-column:2/-1;min-width:0}
.lead{font-family:var(--serif);font-size:clamp(22px,2.17vw,32.5px);line-height:1.23;color:var(--hero);margin:0;max-width:30em;text-wrap:pretty}
.intro{padding-block:clamp(80px,14vw,200px) clamp(60px,8vw,120px);border-top:0}
.text{font-size:18px;line-height:1.35;color:var(--ink);margin:0 0 1em;max-width:40em}
.muted{color:var(--muted)}
.team{grid-column:1/-1;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:40px 8px;margin-top:40px}
.team h3{margin:0 0 10px;font-size:13px;font-weight:400;line-height:1.3;color:var(--muted)}
.team h3 b{font-weight:500;color:var(--ink)}
.team img{display:block;width:100%;height:auto;aspect-ratio:900/1205;object-fit:cover;border-radius:4px;background:var(--chip)}
.team p{margin:12px 0 0;font-size:14px;line-height:1.35;color:var(--ink);max-width:26em}
.pr summary .em{display:inline-block;width:1.6em;font-style:normal}

/* принципы: строка раскрывается по клику, «+» поворачивается в «×» */
.pr{border-bottom:1px solid var(--chip)}
.pr summary{list-style:none;display:flex;justify-content:space-between;align-items:center;gap:16px;padding-block:16px;cursor:pointer;font-size:18px;color:var(--ink)}
.pr summary::-webkit-details-marker{display:none}
.pr summary i{font-style:normal;color:var(--muted);transition:transform .35s cubic-bezier(.23,1,.32,1),color .25s}
.pr[open] summary i{transform:rotate(45deg)}
.pr summary:hover i{color:var(--ink)}
.pr p{margin:0 0 20px;font-size:16px;line-height:1.4;color:var(--muted);max-width:40em}
.pr:first-child summary{padding-top:0}

.list{display:grid;grid-template-columns:repeat(3,1fr);gap:6px 8px;font-size:18px;color:var(--ink)}
.list span small{color:var(--muted);font-size:13px;margin-left:6px}
.mail{display:flex;align-items:center;gap:16px;flex-wrap:wrap;font-size:18px;color:var(--ink)}

@media (max-width:767px){
  .sec{grid-template-columns:1fr;gap:16px}
  .sec > .body{grid-column:1}
  .list{grid-template-columns:1fr 1fr}
  .team{grid-template-columns:minmax(0,1fr) minmax(0,1fr);margin-top:8px}
}
</style>
</head>
<body class="project">
<header id="hdr">
  <a class="logo" href="./" aria-label="Oi.Lab"><span class="mark"></span></a>
  <nav id="nav"></nav>
  <span class="right"><span class="langs"></span></span>
  <div class="fade" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
</header>

<main>
  <section class="sec intro">
    <h2 data-i="a.studio"></h2>
    <div class="body"><p class="lead" data-i="a.studioText"></p></div>
  </section>

  <section class="sec">
    <h2 data-i="a.founder"></h2>
    <div class="body">
      <p class="lead" data-i="a.teamTitle"></p>
    </div>
    <div class="team" id="team"></div>
  </section>

  <section class="sec">
    <h2 data-i="a.principles"></h2>
    <div class="body" id="principles"></div>
  </section>

  <section class="sec">
    <h2 data-i="a.services"></h2>
    <div class="body list" id="services"></div>
  </section>

  <section class="sec">
    <h2 data-i="a.clients"></h2>
    <div class="body list" id="clients"></div>
  </section>

  <section class="sec">
    <h2 data-i="a.recognition"></h2>
    <div class="body"><p class="text muted" data-i="a.recognitionText"></p></div>
  </section>

  <section class="sec">
    <h2 data-i="a.contact"></h2>
    <div class="body mail"><span id="email"></span><a class="write copy" href="#" data-i="a.copy"></a></div>
  </section>
</main>

<footer id="contact"></footer>
<div class="big" id="big" role="img" aria-label="Oilab"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie_light.min.js"></script>
<script src="i18n.js?v=1793816183" charset="utf-8"></script>
<script src="projects.js?v=1793816183" charset="utf-8"></script>
<script>
// Тексты страницы — в i18n.js (ключи a.*)

const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
window.pageRender = () => {
  const EMOJI = ['🔬', '🌎', '📐', '🔎', '💍', '💙'];
  document.getElementById('principles').innerHTML = t('a.principleList').map(([h, d], i) =>
    `<details class="pr"><summary><span><span class="em" aria-hidden="true">${EMOJI[i] || ''}</span>${esc(h)}</span><i aria-hidden="true">+</i></summary><p>${esc(d)}</p></details>`).join('');
  const PHOTO = ['tolegen', 'aibyn', 'konstantin', 'raim'];
  document.getElementById('team').innerHTML = t('a.team').map(([n, r, d], i) =>
    `<figure style="margin:0"><h3><b>${esc(n)}</b> ${esc(r)}</h3><img src="img/team/${PHOTO[i]}.jpg" alt="${esc(n)}" width="900" height="1205" loading="lazy"><p>${esc(d)}</p></figure>`).join('');
  document.getElementById('services').innerHTML = t('a.serviceList').map(x => `<span>${esc(x)}</span>`).join('');
};
pageRender();
document.getElementById('clients').innerHTML = PROJECTS.filter(p => !/^Проект/.test(p.name))
  .map(p => p.case ? `<a href="case.html#${slug(p)}">${esc(p.name)}</a>` : `<span>${esc(p.name)}</span>`).join('');
document.getElementById('email').textContent = EMAIL;

siteChrome();
playLottie('big', 'img/footer-logo.json', 'img/footer-logo.png');
</script>
</body>
</html>
